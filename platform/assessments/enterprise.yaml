# Enterprise assessment (ADR-0005). Declarative: which competencies compose the
# qualification and how much each matters. The engine owns the decision rules —
# nothing here can weaken a gate, minimum, or AL cap.
id: enterprise
version: 1.0.0
schema: 1
description: Enterprise-grade AI-native SDLC qualification for regulated delivery.
profile: enterprise            # EV-dimension weighting
default_risk_tier: RT2
competencies:
  - area: CA-04                # Architecture & Solution Design
    requirement: { type: mandatory }
    weight: 20
  - area: CA-05                # AI-Assisted Implementation
    requirement: { type: mandatory }
    weight: 25
  - area: CA-06                # Testing, Quality & Evaluation
    requirement: { type: mandatory }
    weight: 20
  - area: CA-07                # Security & Privacy Engineering
    requirement: { type: mandatory }
    weight: 20
    min_cl: CL3                # security must reach at least CL3
  - area: CA-12                # Governance, Risk & AI Safety
    requirement: { type: mandatory }
    weight: 15
  - area: CA-09                # Operations, Observability & Reliability (advisory)
    requirement: { type: advisory }
    weight: 10
sampling:
  repeats: 3
