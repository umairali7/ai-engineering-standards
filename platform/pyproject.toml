[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aies-platform"
version = "0.1.0"
description = "AIES Engineering Assessment Platform - executable reference implementation of AESQS (see docs/PLATFORM.md, AIES-DOC-06)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "PyYAML>=6.0",
    # tomllib entered the standard library in Python 3.11.
    "tomli>=2.0; python_version < '3.11'",
    # CA bundle for TLS verification of HTTPS endpoints. Without it, a
    # freshly-installed Python (notably python.org builds on macOS) cannot
    # verify certs and every HTTPS call fails with CERTIFICATE_VERIFY_FAILED.
    "certifi>=2023.7.22",
    # Repository analysis consumes retained coverage/JUnit XML as untrusted
    # evidence; defusedxml rejects entity expansion and external references.
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
# Development extras; runtime dependencies remain intentionally small.
# Install with:  pip install -e ".[test]"
test = ["pytest>=7"]
security = [
    "ruff==0.16.1",
    "pip-audit==2.10.1",
    "truststore==0.10.4",
]
# Detached-signature verification for `aies deployment verify-artifact`.
# Optional: without it, checksum verification still works and signature
# verification reports "unverifiable" rather than a false pass.
crypto = ["cryptography>=41"]

[project.scripts]
aies = "aies.cli:main"

[project.entry-points."aies.adapters"]
mock = "aies.adapters.mock:MockAdapter"
openai-compat = "aies.adapters.openai_compat:OpenAICompatAdapter"
ollama = "aies.adapters.local_runtimes:OllamaAdapter"
lmstudio = "aies.adapters.local_runtimes:LMStudioAdapter"
llamacpp = "aies.adapters.local_runtimes:LlamaCppAdapter"
mlx = "aies.adapters.local_runtimes:MLXAdapter"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aies = ["py.typed"]

# Assessment instruments are runtime data, not Python modules. Install them
# under the environment's share/aies directory so normal wheels behave exactly
# like a source checkout; aies.resources resolves both layouts.
[tool.setuptools.data-files]
"share/aies" = ["measurement-claims-v1.yaml", "MEASUREMENT_CLAIMS.md", "subject-support-v1.yaml", "SUBJECT_SUPPORT.md", "decision-starters-v1.yaml", "perspectives-v1.yaml", "ASSESSMENT_PROFILES.md"]
"share/aies/assessments" = ["assessments/*.yaml"]
"share/aies/subject_profiles" = ["subject_profiles/*.yaml"]
"share/aies/contracts" = ["contracts/*.json", "contracts/*.md"]
"share/aies/profiles" = ["profiles/*.yaml"]
"share/aies/journeys" = ["journeys/*.yaml"]
"share/aies/task_mappings" = ["task_mappings/*.yaml"]
"share/aies/calibration" = ["calibration/design-review-ledger.json"]
"share/aies/competencies/CA-01-ai-native-sdlc-foundations" = ["competencies/CA-01-ai-native-sdlc-foundations/*.yaml"]
"share/aies/competencies/CA-01-ai-native-sdlc-foundations/scenarios" = ["competencies/CA-01-ai-native-sdlc-foundations/scenarios/*.yaml"]
