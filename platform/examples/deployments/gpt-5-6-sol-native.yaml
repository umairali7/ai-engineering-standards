# Frontier judge — OpenAI GPT-5.6 Sol.
# base_url is OpenAI's real API base (/v1); the openai-compat adapter POSTs to
# {base_url}/chat/completions.
#
#   aies deployment add examples/deployments/gpt-5-6-sol-native.yaml
#   export OPENAI_API_KEY=sk-...
#   aies qualify <subject> --rt 2 --judge gpt-5-6-sol-native --parallel 8

id: gpt-5-6-sol-native
family: frontier
model: gpt-5.6-sol
runtime: openai-compat
roles: [judge]
context_window: 1050000        # claim; recorded unverified until discovery probes it
runtime_config:
  base_url: https://api.openai.com/v1
  model: gpt-5.6-sol
  api_key_env: OPENAI_API_KEY
provenance:
  source: "hosted API (served by OpenAI)"
  checksum: "sha256:endpoint-served"
