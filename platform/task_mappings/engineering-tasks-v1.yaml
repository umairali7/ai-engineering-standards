  - {area: CA-07, tasks: [ET-10], rationale: "Security, privacy, threat, and control review."}
  - {area: CA-08, tasks: [ET-15], rationale: "Release engineering and production delivery operations."}
  - {area: CA-09, tasks: [ET-14], rationale: "Observability, incident diagnosis, and reliability signals."}
  - {area: CA-10, tasks: [ET-15], rationale: "Human oversight and operational control of AI work."}
  - {area: CA-11, tasks: [ET-08], rationale: "Context assets, curation, and knowledge documentation."}
