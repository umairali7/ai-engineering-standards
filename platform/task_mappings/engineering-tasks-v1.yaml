id: aies-engineering-tasks-v1
version: 2.0.0
schema: 2
status: review
description: >-
  Subject-neutral Engineering Task Taxonomy and scenario mapping registry for
  ECM. A mapping identifies what a scenario measures; it does not grant a
  qualification or assert a subject capability.
tasks:
  - {id: ET-01, name: Requirements Analysis}
  - {id: ET-02, name: Architecture Design}
  - {id: ET-03, name: API Design}
  - {id: ET-04, name: Code Generation}
  - {id: ET-05, name: Refactoring}
  - {id: ET-06, name: Debugging}
  - {id: ET-07, name: Testing}
  - {id: ET-08, name: Documentation}
  - {id: ET-09, name: Performance Optimization}
  - {id: ET-10, name: Security Review}
  - {id: ET-11, name: Database Design}
  - {id: ET-12, name: Migration}
  - {id: ET-13, name: Infrastructure}
  - {id: ET-14, name: Observability}
  - {id: ET-15, name: Production Operations}
rules:
  # Mapping review is intentionally pending. ADR-0013 approval governs the
  # protocol; it does not substitute for itemized human mapping review.
  - {area: CA-01, tasks: [ET-15], rationale: "AI-native SDLC foundations and autonomy operations.", review: {status: pending}}
  - {area: CA-02, tasks: [ET-01], rationale: "Requirements elicitation, intent, and traceability.", review: {status: pending}}
  - {area: CA-03, tasks: [ET-01], rationale: "Product definition and acceptance criteria inform requirements work.", review: {status: pending}}
  - {area: CA-04, tasks: [ET-02], rationale: "Architecture options, reviews, and decision records.", review: {status: pending}}
  - {area: CA-04, family: api-performance-design, tasks: [ET-02, ET-03, ET-09], rationale: "Architecture evidence directly exercises API contracts and performance design.", review: {status: pending}}
  - {area: CA-04, family: api-database-design, tasks: [ET-02, ET-03, ET-11], rationale: "Architecture evidence directly exercises API contracts and database design.", review: {status: pending}}
  - {area: CA-05, tasks: [ET-04], rationale: "Default implementation evidence.", review: {status: pending}}
  - {area: CA-05, family: refactoring, tasks: [ET-04, ET-05], rationale: "Behavior-preserving code restructuring also produces verified source changes.", review: {status: pending}}
  - {area: CA-05, family: defect-fix, tasks: [ET-04, ET-06], rationale: "Defect diagnosis and repair also produces verified source changes.", review: {status: pending}}
  - {area: CA-05, family: performance-database, tasks: [ET-04, ET-09, ET-11], rationale: "Executable implementation evidence directly exercises performance optimization and database behavior.", review: {status: pending}}
  - {area: CA-05, family: performance-optimization, tasks: [ET-04, ET-09], rationale: "Executable implementation evidence directly exercises measured performance optimization.", review: {status: pending}}
  - {area: CA-06, tasks: [ET-07], rationale: "Test design, review, evaluation, and quality strategy.", review: {status: pending}}
  - {area: CA-06, family: api-validation, tasks: [ET-03, ET-07], rationale: "Contract and integration evaluation directly exercises API design behavior.", review: {status: pending}}
  - {area: CA-06, family: database-validation, tasks: [ET-07, ET-11], rationale: "Stateful and migration evaluation directly exercises database design behavior.", review: {status: pending}}
  - {area: CA-07, tasks: [ET-10], rationale: "Security, privacy, threat, and control review.", review: {status: pending}}
  - {area: CA-08, tasks: [ET-15], rationale: "Release engineering and production delivery operations.", review: {status: pending}}
  - {area: CA-08, family: migration-infrastructure, tasks: [ET-12, ET-13, ET-15], rationale: "Release evidence directly exercises migration and infrastructure delivery.", review: {status: pending}}
  - {area: CA-09, tasks: [ET-06, ET-14], rationale: "Operational diagnosis directly exercises debugging as well as observability and reliability.", review: {status: pending}}
  - {area: CA-09, family: migration-infrastructure, tasks: [ET-06, ET-12, ET-13, ET-14], rationale: "Migration diagnosis directly exercises debugging, migration, and infrastructure reliability.", review: {status: pending}}
  - {area: CA-10, tasks: [ET-15], rationale: "Human oversight and operational control of AI work.", review: {status: pending}}
  - {area: CA-11, tasks: [ET-08], rationale: "Context assets, curation, and knowledge documentation.", review: {status: pending}}
  - {area: CA-12, tasks: [ET-15], rationale: "Risk, governance, guardrails, and operational safety.", review: {status: pending}}
