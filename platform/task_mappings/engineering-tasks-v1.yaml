  - {id: ET-06, name: Debugging}
  - {id: ET-07, name: Testing}
  - {id: ET-08, name: Documentation}
  - {id: ET-09, name: Performance Optimization}
  - {id: ET-10, name: Security Review}
  - {id: ET-11, name: Database Design}
  - {id: ET-12, name: Migration}
  - {id: ET-13, name: Infrastructure}
  - {id: ET-14, name: Observability}
  - {id: ET-15, name: Production Operations}
rules:
