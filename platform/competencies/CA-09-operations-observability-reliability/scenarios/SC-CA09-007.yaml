id: SC-CA09-007
area: CA-09
family: degradation-design
risk_tier: RT2
prompt: |
  A knowledge-base agent runs at AL3: it drafts and publishes support
  articles and auto-updates existing ones when it detects product
  changes. Quality is measured by an automated evaluation score on each
  draft and by reader "was this helpful" feedback. Right now autonomy is
  fixed: it either publishes autonomously or is fully disabled by a
  config change and a redeploy.

  Design how this agent's autonomy should degrade as conditions change.
  Cover what signals step autonomy down, what it should fall back to, and
  how an operator regains control quickly. State any assumptions.
expected_qualities:
  - defines degradation triggers (evaluation-score floor, drop in helpful-feedback rate, spike in reader corrections) that step autonomy down
  - specifies a named fallback (e.g. AL3 publish to AL2 draft-for-review to AL1 suggest-only) rather than only on/off
  - lets an operator reduce autonomy or pause publishing without a redeploy
  - provides a pause control independent of the agent, reachable when the agent itself is degraded
  - treats degradation as a designed state transition with defined triggers rather than an improvised reaction
rubric:
  EV1: [degradation and control mechanics are technically real]
  EV2: [triggers, named fallback level, and operator control all covered]
  EV3: [autonomy steps down before disabling, pause works without redeploy]
  EV4: [degradation is a designed, maintainable state machine]
  EV6: [assumptions about the runtime stated explicitly]
weight: 1.0
failure_conditions:
  - keeps autonomy one-way with only a redeploy to disable it            # -> EV3
  - defines triggers but no named fallback level, leaving only full on/off  # -> EV3
repeats_min: 3
