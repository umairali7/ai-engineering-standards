kind: aies-scenario-pack-v1
defaults:
  area: CA-09
  risk_tier: RT2
  expected_qualities: [uses telemetry to distinguish competing hypotheses, defines service-level impact and safe containment, preserves evidence through change and recovery, supplies actionable ownership thresholds and validation]
  rubric:
    EV1: [diagnosis and operational design follow the supplied evidence]
    EV2: [detection triage containment recovery and learning are covered]
    EV3: [actions protect data authority and blast radius]
    EV4: [telemetry runbooks and automation remain maintainable]
    EV5: [signal and remediation cost are proportionate]
    EV6: [events versions actions owners and outcomes are traceable]
  weight: 1.0
  repeats_min: 1
  failure_conditions: [declares a root cause from correlation alone, recommends a broad restart before preserving evidence]
  calibration:
    objective: replaced by each packed scenario
    ceiling_anchor: replaced by each packed scenario
    expected_refusal: false
    empirical_status: {design_reviewed: false, empirically_calibrated: false}
scenarios:
  - {id: SC-CA09-018, family: migration-infrastructure, prompt: "Design operational readiness for moving a stateful service from VMs to containers. Define baseline signals, shadow traffic, capacity, data and job checks, rollback triggers, and how dashboards preserve comparability across platforms.", calibration: {objective: "operate and verify a compute-platform migration", ceiling_anchor: "A 4 creates platform-neutral service indicators plus migration-specific invariants, controls cohorts, correlates versions, and exercises rollback before state divergence."}}
  - {id: SC-CA09-019, family: migration-infrastructure, prompt: "Operate a database-sharding migration when one tenant shows rising write latency but aggregate SLOs remain green. Define detection, tenant-level evidence, containment, routing rollback, and reconciliation.", calibration: {objective: "detect and contain per-tenant migration failure", ceiling_anchor: "A 4 avoids aggregate masking, joins routing and data state, limits the affected tenant, verifies consistency, and gives precise stop and resume criteria."}}
  - {id: SC-CA09-020, family: migration-infrastructure, prompt: "Define observability and incident procedures for a root-CA rotation. Some clients fail silently, handshake logs sample traffic, and offline devices reconnect weeks later. Include adoption evidence and safe old-root removal.", calibration: {objective: "operate a long-tail trust migration", ceiling_anchor: "A 4 triangulates handshake failure and client inventory, accounts for sampling and offline cohorts, sets evidence-based removal gates, and preserves compromise response."}}
  - {id: SC-CA09-021, family: migration-infrastructure, prompt: "During a broker migration, consumer lag improves but duplicate business actions rise. Provide a diagnosis and containment plan using message identity, producer path, consumer version, and side-effect evidence.", calibration: {objective: "diagnose semantic regression during broker migration", ceiling_anchor: "A 4 distinguishes transport duplicates from consumer idempotency failure, scopes affected versions and keys, contains side effects, and reconciles outcomes before resuming."}}
  - {id: SC-CA09-022, family: migration-infrastructure, prompt: "Design reliability controls for active-active regional rollout where DNS, session affinity, replicated data, and event ordering can each fail differently. Define experiments, per-region SLOs, and failback evidence.", calibration: {objective: "operate multi-region infrastructure safely", ceiling_anchor: "A 4 tests independent failure planes and partition behavior, measures regional and global user impact, prevents failover oscillation, and validates data before failback."}}
  - {id: SC-CA09-023, family: migration-infrastructure, prompt: "An object-storage migration reports 100% object count parity but customers see corrupted downloads. Diagnose why count is insufficient and define integrity, metadata, encryption, and in-flight-write reconciliation.", calibration: {objective: "verify migrated object integrity", ceiling_anchor: "A 4 uses content and metadata evidence stratified by state, identifies multipart and concurrent-write gaps, contains cutover, and produces a defensible completeness proof."}}
  - {id: SC-CA09-024, family: migration-infrastructure, prompt: "Define observability for moving secrets to a managed store. Teams need to know which workloads still use old secrets without logging secret values. Include version telemetry, access anomalies, expiry, and emergency rollback.", calibration: {objective: "observe secret migration without disclosure", ceiling_anchor: "A 4 records nonsecret version and workload identity, measures old-use decay and failed access, detects anomalies, and distinguishes service rollback from credential reactivation."}}
  - {id: SC-CA09-025, family: migration-infrastructure, prompt: "Operate a Kubernetes upgrade when error rate is stable but pod startup doubles and node drains stall. Define evidence to distinguish image, admission, scheduler, storage, and capacity causes; set rollout decisions.", calibration: {objective: "diagnose latent orchestrator-upgrade regression", ceiling_anchor: "A 4 correlates upgrade cohort and lifecycle spans, tests competing control-plane hypotheses, protects disruption capacity, and gates continuation on service and recovery indicators."}}
  - {id: SC-CA09-026, family: migration-infrastructure, prompt: "Design post-cutover monitoring for an identity-provider migration. Login success is high, but recovery, MFA enrollment, service accounts, and linked identities have different risk. Define segmented SLOs, alerts, and rollback limits.", calibration: {objective: "operate identity migration beyond aggregate login rate", ceiling_anchor: "A 4 segments critical journeys and populations, detects collision and lockout, protects service identities, and states where session or identity changes make rollback unsafe."}}
  - {id: SC-CA09-027, family: migration-infrastructure, prompt: "During a warehouse migration, row totals match but finance metrics differ after late facts arrive. Design reconciliation that identifies semantic, timezone, deduplication, and update-window causes and governs dashboard cutover.", calibration: {objective: "diagnose analytical migration divergence", ceiling_anchor: "A 4 compares versioned metric lineage and event-time cohorts, isolates transformation differences, preserves close evidence, and blocks consumer cutover on unresolved material variance."}}
  - {id: SC-CA09-028, family: reliability-analysis, prompt: "A service meets average latency but mobile users in one region time out. Logs are sampled and CDN metrics disagree with origin metrics. Build a diagnosis, new telemetry, containment, and validation plan.", calibration: {objective: "diagnose masked regional tail latency", ceiling_anchor: "A 4 reconstructs the end-to-end path with region and client segmentation, accounts for sampling, separates edge from origin, and validates containment against user-visible tails."}}
  - {id: SC-CA09-029, family: reliability-analysis, prompt: "A retry policy reduced visible errors but database load and duplicate writes increased. Define how to diagnose retry amplification, contain it, and redesign metrics and budgets across client, gateway, and service layers.", calibration: {objective: "diagnose and control retry amplification", ceiling_anchor: "A 4 correlates attempt lineage across layers, quantifies amplification and side effects, applies bounded budgeted retries with idempotency, and verifies real success rather than hidden errors."}}
  - {id: SC-CA09-030, family: reliability-analysis, prompt: "Design observability for an asynchronous workflow spanning six services and lasting days. Events can duplicate or arrive late; users need case status and operators need the exact stuck transition without high-cardinality explosions.", calibration: {objective: "observe long-running distributed workflows", ceiling_anchor: "A 4 uses stable workflow and transition identities with bounded dimensions, derives state from durable events, detects overdue transitions, and links user status to operator evidence."}}
  - {id: SC-CA09-031, family: reliability-analysis, prompt: "An AI endpoint's token throughput is stable but time-to-first-token degrades intermittently. GPU, queue, prompt length, cache, and routing are possible causes. Define instrumentation and an evidence-led investigation.", calibration: {objective: "diagnose intermittent inference startup latency", ceiling_anchor: "A 4 decomposes queue, preprocess, route, load and first compute spans, stratifies workload and hardware, preserves exemplars, and tests hypotheses without guessing from utilization."}}
  - {id: SC-CA09-032, family: reliability-analysis, prompt: "Create an alert strategy for a scheduled settlement job where late completion matters more than individual task errors. Jobs cross midnight, rerun selectively, and holidays alter deadlines.", calibration: {objective: "alert on business completion rather than noisy task errors", ceiling_anchor: "A 4 models versioned business deadlines and completeness, distinguishes delay from failure, links missing partitions, supports selective rerun, and assigns actionable escalation."}}
  - {id: SC-CA09-033, family: reliability-analysis, prompt: "A cache outage causes graceful fallback but cloud cost rises tenfold and the database approaches saturation. Define degradation stages, cost and capacity signals, load shedding, recovery, and a test plan.", calibration: {objective: "operate graceful degradation within economic and capacity bounds", ceiling_anchor: "A 4 connects cache health to database and cost budgets, stages feature and tenant shedding, prevents recovery stampede, and rehearses the full failure curve."}}
  - {id: SC-CA09-034, family: reliability-analysis, prompt: "Design telemetry for authorization decisions that supports incident investigation and customer explanation without logging sensitive resource names or creating unbounded cardinality.", calibration: {objective: "make authorization observable and privacy-preserving", ceiling_anchor: "A 4 records stable policy, actor class, decision reason and correlation with protected identifiers, controls access and retention, and proves explanations from the same evidence."}}
  - {id: SC-CA09-035, family: reliability-analysis, prompt: "A memory leak appears only after several hot reloads and autoscaling hides it by replacing instances. Define detection, reproduction, safe capture, containment, and proof of repair.", calibration: {objective: "diagnose lifecycle-dependent memory growth", ceiling_anchor: "A 4 tracks memory by process age and reload count, captures bounded profiles safely, removes autoscaling masking in a controlled test, and validates slope rather than one snapshot."}}
  - {id: SC-CA09-036, family: reliability-analysis, prompt: "Design incident telemetry and runbook behavior for a third-party API that returns valid-looking stale data rather than errors. Freshness requirements vary by use case and no global circuit breaker is safe.", calibration: {objective: "detect and contain semantic dependency failure", ceiling_anchor: "A 4 validates freshness and plausibility per consumer, exposes data age, applies scoped degradation, preserves samples, and defines recovery verification beyond HTTP success."}}
  - {id: SC-CA09-037, family: reliability-analysis, prompt: "A deployment correlates with elevated cancellations, but an unrelated marketing campaign changed traffic composition simultaneously. Define an investigation and rollout decision using cohorts, counterfactual evidence, and safe containment.", calibration: {objective: "separate release effect from traffic confounding", ceiling_anchor: "A 4 uses version and comparable traffic cohorts, tests mechanism-level signals, states causal limits, limits exposure, and defines evidence for rollback or continuation."}}
