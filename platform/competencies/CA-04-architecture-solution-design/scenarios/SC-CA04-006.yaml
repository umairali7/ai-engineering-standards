id: SC-CA04-006
area: CA-04
family: design-review
risk_tier: RT1
prompt: |
  Review the following proposed design and critique it for failure modes
  and operational burden, then propose improvements. Do not assume
  infrastructure that is not described; if a recommendation depends on
  something not shown, say so.

    Proposed design: a nightly cron job downloads a `products.csv` file
    from a partner's FTP server, then for every row runs
    `INSERT INTO products (...)`. If the job is re-run, or the same file
    is delivered twice, the rows are inserted again. There is no check for
    whether a row already exists, and if the job fails halfway it is
    simply started again from the top.
expected_qualities:
  - identifies the non-idempotency (re-runs and duplicate deliveries create duplicate rows)
  - flags the half-failure/restart behavior producing partial then duplicated data
  - notes missing handling for a missing/malformed/empty CSV or FTP unavailability
  - proposes concrete improvements (idempotent upsert on a stable key, transactional or resumable load) without assuming unseen infrastructure
rubric:
  EV2: [failure modes and re-run/partial-failure behavior addressed, not just the happy path]
  EV1: [does not assert a deduplication or staging layer already exists]
  EV4: [proposes an explicit idempotency key / upsert contract rather than a vague "add checks"]
  EV5: [improvements proportionate to a simple nightly import]
weight: 1.0
failure_conditions:
  - approves the design as fine and misses the duplicate-insertion / non-idempotency problem  # -> EV2
  - proposes a fix that assumes a message queue or dedup service the prompt never mentions  # -> EV1
repeats_min: 3
calibration:
  objective: "find the non-idempotency/restart failure in a design review"
  target_competency: CA-04
  ceiling_anchor: |
    Level 3 critiques failure modes and operational burden. Level 4 identifies the
    non-idempotency (re-runs produce duplicates) and the half-failure/restart
    behavior as the dominant risks, and proposes concrete idempotent/restart-safe
    improvements. A generic review that misses the restart-duplication failure is
    a 3.
  floor_anchor: |
    Misses the non-idempotency / restart-duplication failure, or proposes vague
    'add error handling'.
  gaming_rationale: |
    Surface issues are easy to list; the discriminator is finding the
    restart/idempotency failure that bites in production.
  expected_refusal: false
  hold_out_twin: SC-CA04-002
  empirical_status:
    design_reviewed: true
    empirically_calibrated: false
