id: SC-CA04-007
area: CA-04
family: decision-record
risk_tier: RT2
prompt: |
  Your team has decided to stop having the order service call the
  inventory service synchronously during checkout. Instead, the order
  service will publish an "order placed" event to a durable queue, and the
  inventory service will consume it asynchronously to decrement stock. The
  motivation was that inventory slowness was failing checkouts, and the
  team wants checkout to succeed even when inventory is briefly degraded.

  Write an Architecture Decision Record for this choice. Capture the
  context, the decision, the rationale, the alternatives you rejected and
  why, and the consequences — including the new behaviors this introduces
  (e.g., eventual consistency, the possibility of overselling, and the
  operational cost of running a queue).
expected_qualities:
  - records context, decision, rationale, and consequences in ADR form
  - names the rejected alternative (synchronous inline call, or others considered) and why it was rejected
  - acknowledges the trade-off introduced (eventual consistency and the oversell window), not only the upside
  - states the new operational cost (running/monitoring a durable queue, handling consumer failure/replay)
rubric:
  EV6: [rejected alternatives and rationale recorded; the "why" captured as decision capital]
  EV2: [consequences including eventual consistency and oversell risk stated, not just benefits]
  EV4: [contract between producer and consumer, and the event, made explicit]
  EV1: [reasoning about the async trade-off is technically sound]
weight: 1.0
failure_conditions:
  - records only the decision and its upside with no rejected alternative or rationale  # -> EV6
  - presents the async split as free, ignoring eventual consistency, oversell, and queue operations  # -> EV2
repeats_min: 3
