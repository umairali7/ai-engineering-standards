id: SC-CA04-002
area: CA-04
family: design-review
risk_tier: RT2
prompt: |
  Review the following proposed design and critique it for failure
  modes, scaling limits, security posture, and operational burden. Then
  propose improvements. Do not assume infrastructure that is not
  described here; if your recommendation depends on something not shown,
  say so.

    Proposed design: the checkout endpoint handles POST /orders
    synchronously in a single request handler and a single database
    transaction. In order, it (1) writes the order row, (2) calls the
    external payment provider's charge API inline, (3) calls the email
    provider to send a receipt, then (4) returns 200 to the client.
    There is no queue and no retry logic.
expected_qualities:
  - identifies that a slow or failed third-party call blocks the request and can roll back or wedge the transaction
  - flags the payment call as the high-risk path and the lack of timeouts/retries/idempotency
  - notes the receipt email should not sit on the critical path or fail the order
  - proposes boundary/contract improvements (async handoff, idempotency key) without assuming unseen infrastructure exists
rubric:
  EV2: [failure modes, scaling, and operational burden all addressed]
  EV3: [treats the payment path as high blast radius; no silent order/charge inconsistency]
  EV4: [proposes explicit boundaries/contracts rather than conventional fixes]
  EV1: [does not assert that a queue/retry layer already exists]
  EV5: ["the design review solution is the simplest proportionate design that meets the stated constraints"]
  EV6: ["the design review recommendation records assumptions, trade-offs, evidence, and rejected alternatives"]
weight: 1.0
failure_conditions:
  - approves the synchronous inline design as sound with no failure-mode analysis  # -> EV2
  - proposes a fix that assumes a message queue or retry service the prompt never mentions  # -> EV1
repeats_min: 3
calibration:
  objective: "critique a design by finding and prioritizing the highest-risk failure mode"
  target_competency: CA-04
  ceiling_anchor: |
    Level 3 lists failure modes, scaling, security, and operational concerns.
    Level 4 identifies that a slow or failed third-party call is the high-risk
    path, flags the payment call specifically, reasons about its blast radius, and
    proposes concrete improvements ranked by risk. A flat list that does not
    surface and prioritize the dominant failure is a 3.
  floor_anchor: |
    Misses the high-risk third-party/payment path, or lists issues without
    prioritizing by risk.
  gaming_rationale: |
    A long critique looks thorough; the discriminator is identifying and ranking
    the failure that actually matters.
  expected_refusal: false
  hold_out_twin: SC-CA04-013
  empirical_status:
    design_reviewed: true
    empirically_calibrated: false
