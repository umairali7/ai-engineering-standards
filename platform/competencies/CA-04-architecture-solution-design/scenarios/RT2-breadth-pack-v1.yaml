kind: aies-scenario-pack-v1
defaults:
  area: CA-04
  risk_tier: RT2
  expected_qualities: [compares genuinely distinct options against explicit quality attributes, defines contracts and failure behavior, addresses security operability and evolution, records assumptions evidence and the dominant trade-off]
  rubric:
    EV1: [design is technically coherent under the stated load and failure modes]
    EV2: [interfaces, data, states, dependencies, migration, and operations are covered]
    EV3: [trust boundaries, authorization, privacy, and safe failure are designed]
    EV4: [components and contracts can evolve without hidden coupling]
    EV5: [capacity and cost choices are evidence-based and proportionate]
    EV6: [decision, alternatives, assumptions, and verification are traceable]
  weight: 1.1
  repeats_min: 1
  failure_conditions: [asserts unavailable platform capabilities as fact, names a pattern without resolving the stated trade-offs]
  calibration:
    objective: replaced by each packed scenario
    ceiling_anchor: replaced by each packed scenario
    floor_anchor: "A 0–2 response names components or patterns without resolving the stated quality attributes, failure modes, data boundaries, alternatives, or verification strategy."
    gaming_rationale: "Pattern-name matching cannot succeed: the response must connect scenario-specific forces to explicit decisions, rejected alternatives, consequences, and measurable validation."
    expected_refusal: false
    empirical_status: {design_reviewed: false, empirically_calibrated: false}
scenarios:
  - {id: SC-CA04-018, family: api-performance-design, prompt: "Design a public search API for 50 million records with p95 under 300 ms, filters that evolve monthly, strict tenant isolation, and clients that retry. Compare pagination and indexing options; define contracts, limits, caching, failure, and measurement.", calibration: {objective: "design an evolvable low-latency search API", ceiling_anchor: "A 4 connects cursor semantics, index and cache choices to consistency and tenant safety, quantifies capacity assumptions, and defines load verification."}}
  - {id: SC-CA04-019, family: api-performance-design, prompt: "Design an idempotent payment-intent API used by mobile clients with unreliable networks. Requests may arrive out of order, processors time out, and status webhooks duplicate. Define state machine, keys, concurrency, errors, and SLOs.", calibration: {objective: "design a correct retry-safe payment contract", ceiling_anchor: "A 4 defines durable idempotency scope and expiry, reconciles unknown processor outcomes, prevents double effects, and makes every state observable."}}
  - {id: SC-CA04-020, family: api-performance-design, prompt: "Design a bulk-import API for files up to 20 GB with schema validation, partial row errors, cancellation, resumability, quotas, and asynchronous completion. Compare upload and processing architectures.", calibration: {objective: "design scalable resumable bulk ingestion", ceiling_anchor: "A 4 separates transport from processing, uses bounded streaming and durable checkpoints, defines item-level outcomes, and prevents one tenant exhausting capacity."}}
  - {id: SC-CA04-021, family: api-performance-design, prompt: "Design a real-time collaboration API for documents with offline edits, 5,000 concurrent viewers, access revocation, regional latency, and ordered audit. Compare conflict-resolution and transport options.", calibration: {objective: "design performant auditable collaboration", ceiling_anchor: "A 4 resolves consistency, revocation and ordering tensions explicitly, defines protocol backpressure and reconnect, and validates scale with measurable workloads."}}
  - {id: SC-CA04-022, family: api-performance-design, prompt: "Design an inference gateway API serving models with different context limits and latency. It must stream, enforce budgets, route by capability, cancel work, and expose no provider secrets. Define compatibility and overload behavior.", calibration: {objective: "design a safe efficient multi-model gateway", ceiling_anchor: "A 4 defines a stable capability contract, end-to-end cancellation and accounting, bounded queues and degradation, and provider isolation without hiding semantic differences."}}
  - {id: SC-CA04-023, family: api-performance-design, prompt: "Design a webhook delivery API for one million subscriptions with ordering required per account, at-least-once delivery, slow consumers, secret rotation, replay, and retention limits.", calibration: {objective: "design scalable ordered webhook delivery", ceiling_anchor: "A 4 partitions by ordering key, bounds retries and backlogs, specifies signatures and rotation, exposes replay semantics, and measures consumer-driven saturation."}}
  - {id: SC-CA04-024, family: api-performance-design, prompt: "Design a GraphQL boundary over eight services when nested queries can explode cost, schemas deploy independently, and mobile clients stay old for years. Define authorization, cost controls, caching, deprecation, and failure composition.", calibration: {objective: "design a governed federated query API", ceiling_anchor: "A 4 enforces field-level policy and query budgets, handles partial failure honestly, versions schema evolution, and ties caching to identity and consistency."}}
  - {id: SC-CA04-025, family: api-performance-design, prompt: "Design a rate-limiting API shared by edge and regional services. Limits combine tenant, user, endpoint, and burst rules; regions may partition; decisions must be explainable and low latency.", calibration: {objective: "design distributed explainable rate enforcement", ceiling_anchor: "A 4 makes consistency and failure-mode trade-offs explicit, prevents bypass across dimensions, returns stable policy evidence, and validates hot-key behavior."}}
  - {id: SC-CA04-026, family: api-performance-design, prompt: "Design an image-transformation API with arbitrary client dimensions, signed source URLs, expensive operations, CDN caching, and abuse risk. Define canonicalization, quotas, cache keys, invalidation, and safe formats.", calibration: {objective: "design a cache-efficient abuse-resistant media API", ceiling_anchor: "A 4 bounds the transformation space, canonicalizes authorization-aware cache identity, prevents decompression and SSRF hazards, and measures cost amplification."}}
  - {id: SC-CA04-027, family: api-performance-design, prompt: "Design a timeline API that merges events from three sources with different freshness and occasionally missing history. It must support stable pagination during updates and disclose partial results.", calibration: {objective: "design stable pagination over changing federated data", ceiling_anchor: "A 4 defines snapshot or cursor semantics, source watermarks and partiality, deduplication and ordering, and evaluates latency versus completeness."}}
  - {id: SC-CA04-028, family: api-database-design, prompt: "Design the API and data model for hierarchical permissions with inheritance, explicit deny, temporary grants, groups, and historical explanation of why access existed at a past time.", calibration: {objective: "design explainable temporal authorization data", ceiling_anchor: "A 4 defines deterministic precedence and temporal versioning, efficient evaluation and invalidation, and an explanation contract derived from the same decision evidence."}}
  - {id: SC-CA04-029, family: api-database-design, prompt: "Design a customer-address API where applications need current addresses, invoices need immutable historical values, corrections require audit, and residency limits replication.", calibration: {objective: "design current and historical address semantics", ceiling_anchor: "A 4 separates versioned identity from immutable snapshots, defines correction and residency behavior, and prevents current updates rewriting historical evidence."}}
  - {id: SC-CA04-030, family: api-database-design, prompt: "Design an inventory reservation API spanning warehouses. Reservations expire, checkout retries, stock events arrive late, and overselling must be bounded. Define consistency, schema, state, and reconciliation.", calibration: {objective: "design bounded-consistency inventory reservations", ceiling_anchor: "A 4 specifies atomic reservation invariants, expiry and retry identity, late-event reconciliation and measurable oversell bounds instead of claiming global instant consistency."}}
  - {id: SC-CA04-031, family: api-database-design, prompt: "Design an audit-query API over append-only events containing corrections, redactions, legal holds, and multiple schema versions. Queries need time travel and proof that results are complete.", calibration: {objective: "design verifiable evolving audit storage", ceiling_anchor: "A 4 preserves append-only correction semantics and redaction evidence, versions interpretation, defines completeness proofs, and separates query views from source records."}}
  - {id: SC-CA04-032, family: api-database-design, prompt: "Design a multi-tenant feature-flag API and schema with percentage rollout, prerequisites, emergency kill switches, environment promotion, and evaluation at edge locations during control-plane outages.", calibration: {objective: "design safe resilient feature configuration", ceiling_anchor: "A 4 defines deterministic evaluation and versioned snapshots, isolation and override precedence, stale-mode limits, and an auditable emergency path."}}
  - {id: SC-CA04-033, family: api-database-design, prompt: "Design a messaging API supporting edits, deletion, retention, legal hold, device sync, and end-to-end encryption. Explain which requirements conflict and present viable options rather than assuming all are simultaneously possible.", calibration: {objective: "surface and resolve messaging data conflicts", ceiling_anchor: "A 4 identifies cryptographic versus server-control limits, offers distinct designs with explicit consequences, and refuses an impossible silent compromise."}}
  - {id: SC-CA04-034, family: api-database-design, prompt: "Design an experimentation API and data model for mutually exclusive tests, delayed conversions, user deletion, bot filtering, and reproducible historical analysis when assignment rules evolve.", calibration: {objective: "design reproducible privacy-aware experimentation", ceiling_anchor: "A 4 persists versioned assignment evidence, models exclusivity and late outcomes, handles deletion without corrupting definitions, and prevents post-hoc rule drift."}}
  - {id: SC-CA04-035, family: api-database-design, prompt: "Design a scheduling API for recurring events across time zones, daylight-saving changes, exceptions, and calendar-provider synchronization. Define identifiers, recurrence storage, conflict, and update semantics.", calibration: {objective: "design correct recurrence and synchronization semantics", ceiling_anchor: "A 4 separates local intent from generated instances, handles timezone rule changes and exceptions, defines provider conflict identity, and tests DST boundaries."}}
  - {id: SC-CA04-036, family: api-database-design, prompt: "Design a consent API and ledger where purposes, policies, jurisdictions, and data processors change over time. Services need a fast current decision and auditors need the exact basis for an old decision.", calibration: {objective: "design low-latency temporal consent decisions", ceiling_anchor: "A 4 versions policy and evidence, derives cacheable current decisions safely, invalidates on change, and reconstructs the historical legal and user basis."}}
  - {id: SC-CA04-037, family: api-database-design, prompt: "Design a case-management API for configurable workflows whose schema changes while cases are active. Include validation, migration, search, authorization by state, and replay of historical decisions.", calibration: {objective: "design evolvable long-lived workflow state", ceiling_anchor: "A 4 versions definition and data together, defines in-flight migration choices, preserves authorization and replay, and avoids an unqueryable generic blob."}}
