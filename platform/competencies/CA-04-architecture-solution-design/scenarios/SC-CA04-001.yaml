id: SC-CA04-001
area: CA-04
family: option-analysis
risk_tier: RT2
prompt: |
  A team needs a notification service with these requirements:

    - must deliver notifications over email and SMS today
    - must be extensible to new channels (e.g., push) without rewriting callers
    - must tolerate a third-party provider outage without losing notifications
    - expected volume is modest (thousands per day), a single team owns it

  Propose two or three architecture options. For each, give the key
  trade-offs across the stated quality attributes. Recommend one, and be
  explicit about which options you rejected and why. State the
  assumptions your analysis rests on.
expected_qualities:
  - presents genuinely distinct options (not one option with cosmetic variants)
  - trade-offs are argued against the stated attributes (extensibility, outage tolerance, cost/complexity at this volume)
  - names the rejected options and the reason each was rejected
  - lists assumptions (e.g., about volume, ownership, provider SLAs)
rubric:
  EV6: [trade-offs and rejected options stated with reasons; assumptions listed]
  EV1: [recommended option actually meets the stated requirements]
  EV2: [outage tolerance and extensibility both addressed]
  EV5: [design proportionate to the modest stated volume, not over-engineered]
  EV3: ["the option analysis design respects trust boundaries, blast radius, and human ownership of consequential choices"]
  EV4: ["the option analysis output defines stable contracts, invariants, and structure another engineer can evolve"]
weight: 1.0
failure_conditions:
  - recommends one option without naming any rejected alternative or trade-off  # -> EV6
  - proposes heavy infrastructure unjustified by the stated modest volume        # -> EV5
repeats_min: 3
calibration:
  objective: "analyze genuinely distinct options against the stated attributes and recommend"
  target_competency: CA-04
  ceiling_anchor: |
    Level 3 lists options for the notification service. Level 4 presents genuinely
    DISTINCT options (not one design in three outfits), argues each trade-off
    against the stated attributes (multi-channel now, extensibility later), and
    makes a defensible recommendation tied to those attributes. Options that
    collapse to one, or trade-offs not grounded in the requirements, are a 3.
  floor_anchor: |
    Presents one option dressed up as several, or argues trade-offs not tied to
    the stated attributes.
  gaming_rationale: |
    Any list looks like analysis; the discriminator is genuine distinctness and
    trade-offs grounded in the actual requirements.
  expected_refusal: false
  hold_out_twin: SC-CA04-012
  empirical_status:
    design_reviewed: true
    empirically_calibrated: false
