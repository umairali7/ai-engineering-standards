kind: aies-scenario-pack-v1
defaults:
  area: CA-11
  family: knowledge-engineering
  risk_tier: RT2
  expected_qualities: [selects minimal task-relevant authoritative context, preserves version source scope and access metadata, detects conflict staleness poisoning and missing evidence, defines lifecycle ownership retrieval evaluation and removal]
  rubric:
    EV1: [context supports the task without false or conflicting authority]
    EV2: [selection assembly retrieval update and failure behavior are covered]
    EV3: [sensitive untrusted and unauthorized content is contained]
    EV4: [assets are structured versioned owned and maintainable]
    EV5: [context is concise and retrieval cost is proportionate]
    EV6: [source version transformation access and use are traceable]
  weight: 1.0
  repeats_min: 1
  failure_conditions: [dumps all available content into context, treats recency or vector similarity as authority]
  calibration:
    objective: replaced by each packed scenario
    ceiling_anchor: replaced by each packed scenario
    expected_refusal: false
    empirical_status: {design_reviewed: false, empirically_calibrated: false}
scenarios:
  - {id: SC-CA11-018, prompt: "Design context assembly for a coding agent modifying a service whose README, ADR, generated API spec, code, and runbook disagree. Define authority, conflict handling, token budget, and evidence returned to the reviewer.", calibration: {objective: "assemble authoritative context under conflict", ceiling_anchor: "A 4 ranks sources by decision domain and version, surfaces unresolved conflict, selects only task-relevant excerpts, and cites every applied constraint."}}
  - {id: SC-CA11-019, prompt: "Design a knowledge base for customer-support policies that vary by country and effective date. Draft policies coexist with active ones, emergency notices expire, and answers need exact citations.", calibration: {objective: "engineer temporal jurisdictional policy knowledge", ceiling_anchor: "A 4 models status, jurisdiction and effective intervals, prevents draft retrieval as authority, expires emergency overlays, and evaluates answers at historical boundaries."}}
  - {id: SC-CA11-020, prompt: "A RAG index contains documents inherited from shared drives whose permissions change after ingestion. Design identity, authorization, refresh, deletion, citation, and tests that prevent stale access from leaking content or existence.", calibration: {objective: "preserve source authorization through indexing", ceiling_anchor: "A 4 carries authoritative ACL identity to retrieval and rendering, handles revocation promptly, protects metadata, and tests permission changes rather than trusting index-time access."}}
  - {id: SC-CA11-021, prompt: "Design a prompt-library lifecycle used by dozens of agents. Templates have variables, tool permissions, model-specific assumptions, tests, owners, and deprecations. Prevent copied old prompts from bypassing updates.", calibration: {objective: "govern reusable executable prompt assets", ceiling_anchor: "A 4 versions prompt, model and tool contract together, validates variables and safety, tracks consumers, provides migration and expiry, and detects unmanaged copies."}}
  - {id: SC-CA11-022, prompt: "Define context for an incident assistant when logs, dashboards, tickets, chat, and runbooks contain conflicting timestamps and untrusted user strings. Preserve evidence without letting embedded instructions control tools.", calibration: {objective: "assemble safe incident context from mixed trust", ceiling_anchor: "A 4 normalizes time and provenance, separates observation from assertion, labels untrusted text as data, minimizes sensitive content, and ties actions to authorized evidence."}}
  - {id: SC-CA11-023, prompt: "Design retrieval for an engineering assistant answering 'how do we deploy this service?' when branches, tags, environment overlays, and an external wiki differ. The answer must target one commit and environment.", calibration: {objective: "bind procedural knowledge to exact deployment context", ceiling_anchor: "A 4 resolves repository and environment identity first, prioritizes executable versioned sources, exposes discrepancies, and refuses a generic command when target evidence is missing."}}
  - {id: SC-CA11-024, prompt: "A model's context window grows, and a team proposes including the entire repository. Design an experiment and assembly strategy that measures whether more context improves code changes while controlling distraction, secrets, latency, and cost.", calibration: {objective: "optimize repository context empirically", ceiling_anchor: "A 4 compares task-stratified minimal and expanded context with leakage and outcome measures, uses dependency-aware selection, and does not equate capacity with usefulness."}}
  - {id: SC-CA11-025, prompt: "Design knowledge handling for legal clauses extracted from signed contracts. OCR can be wrong, amendments supersede clauses, access is restricted, and generated summaries must never replace the source.", calibration: {objective: "engineer authoritative amended contract knowledge", ceiling_anchor: "A 4 preserves source image and extraction confidence, models amendment precedence, enforces access, cites exact clauses, and blocks unsupported summary authority."}}
  - {id: SC-CA11-026, prompt: "Define a context protocol for handing a software task between agents. Include objective, scope, decisions, changed files, tests, unresolved risks, credentials boundaries, and freshness without copying private scratch reasoning.", calibration: {objective: "create concise safe agent handoff context", ceiling_anchor: "A 4 transmits verifiable state and rationale artifacts, explicit permissions and unresolved items, validates freshness, and excludes secrets and unverifiable hidden reasoning."}}
  - {id: SC-CA11-027, prompt: "Design a taxonomy and retrieval policy for product requirements where one feature spans customer, compliance, API, analytics, and operations concerns. Avoid duplicate requirements diverging across folders.", calibration: {objective: "organize cross-cutting requirements without duplication", ceiling_anchor: "A 4 establishes canonical requirement identity with multiple views and typed links, ownership and change propagation, and retrieval by task and decision context."}}
  - {id: SC-CA11-028, prompt: "A knowledge ingestion pipeline summarizes long documents before indexing. Design controls for omitted exceptions, tables, negation, citation offsets, model changes, and the ability to reproduce what a past answer saw.", calibration: {objective: "make summarized retrieval reproducible and loss-aware", ceiling_anchor: "A 4 retains source and transformation identity, tests exception and negation preservation, uses summary only where adequate, and reconstructs historical retrieval context."}}
  - {id: SC-CA11-029, prompt: "Design context freshness for rapidly changing cloud-provider documentation. Cached pages improve availability, but APIs and limits change. Define version detection, staleness labels, fallback, evaluation, and source authority.", calibration: {objective: "manage volatile external technical knowledge", ceiling_anchor: "A 4 detects meaningful version change, binds advice to dated primary sources and target environment, degrades visibly offline, and tests stale high-impact recommendations."}}
  - {id: SC-CA11-030, prompt: "Define a secure memory design for a coding assistant that should remember project conventions but not credentials, personal data, abandoned decisions, or one developer's temporary preferences. Include write, review, expiry, and deletion.", calibration: {objective: "engineer governed persistent assistant memory", ceiling_anchor: "A 4 restricts memory to explicit durable project facts with provenance and ownership, filters sensitive content, expires superseded entries, and supports inspection and deletion."}}
  - {id: SC-CA11-031, prompt: "Design a golden knowledge set for evaluating answers about an internal platform. Documentation contains intentional deprecated examples and environment-specific behavior. Define sampling, authority, expected abstention, and update governance.", calibration: {objective: "build a discriminating knowledge evaluation set", ceiling_anchor: "A 4 includes conflict, deprecation, environment and missing-evidence cases, anchors answers to versioned sources, tests abstention, and prevents test leakage."}}
  - {id: SC-CA11-032, prompt: "An MCP server exposes tools and resource descriptions that an agent uses dynamically. Design the context and trust model for capability discovery, schema changes, malicious descriptions, authorization, and traceability.", calibration: {objective: "engineer trustworthy dynamic tool context", ceiling_anchor: "A 4 treats descriptions as untrusted metadata, verifies server identity and schemas, separates discovery from authority, pins consequential capabilities, and logs selected contract versions."}}
  - {id: SC-CA11-033, prompt: "Design retrieval over multilingual policy documents when translations lag originals and legal authority remains with one language. Users need answers in their language with transparent limitations.", calibration: {objective: "engineer multilingual knowledge with source authority", ceiling_anchor: "A 4 preserves authoritative-language linkage and version, labels translation status, retrieves jurisdiction and effective date correctly, and cites both source and translation."}}
  - {id: SC-CA11-034, prompt: "Define context construction for database migration generation using schema, sampled statistics, query logs, data classifications, and deployment constraints. Minimize sensitive data and prevent stale schema advice.", calibration: {objective: "assemble safe current migration context", ceiling_anchor: "A 4 uses schema identity and aggregated statistics rather than row data, validates freshness and target version, includes operational constraints, and traces every generated assumption."}}
  - {id: SC-CA11-035, prompt: "A documentation assistant receives user feedback that an answer was wrong. Design how feedback becomes a knowledge correction without letting one malicious report poison sources or silently rewrite history.", calibration: {objective: "govern knowledge correction from untrusted feedback", ceiling_anchor: "A 4 treats feedback as a lead, requires authoritative verification and review, versions corrections and affected outputs, and retains accountable history."}}
  - {id: SC-CA11-036, prompt: "Design context for comparing two model qualification runs when suites, environments, mappings, and reviewer admission differ. Prevent a fluent comparison from implying unsupported capability changes.", calibration: {objective: "assemble protocol-compatible comparison context", ceiling_anchor: "A 4 checks identity and protocol compatibility first, separates comparable metrics from caveated observations, retains sample and rater provenance, and refuses a winner where evidence differs materially."}}
  - {id: SC-CA11-037, prompt: "Define lifecycle and retrieval for runbooks that contain executable commands. Commands vary by platform, can become destructive after architecture changes, and operators need offline access during incidents.", calibration: {objective: "govern executable operational knowledge", ceiling_anchor: "A 4 binds commands to environment and version with preconditions and authority, tests them safely, signs offline bundles, expires unsafe steps, and provides recovery checks."}}
