kind: aies-scenario-pack-v1
defaults:
  area: CA-01
  risk_tier: RT2
  expected_qualities:
    - resolves the competing delivery, evidence, and control constraints
    - produces a concrete lifecycle decision with named verification points
    - preserves human accountability and a recoverable audit trail
    - separates known facts, assumptions, and unresolved evidence
  rubric:
    EV1: [decision fits the stated lifecycle facts and constraints]
    EV2: [all requested stages, owners, and exception paths are covered]
    EV3: [risk controls and authority boundaries remain effective]
    EV4: [process and artifacts remain maintainable across teams]
    EV5: [control cost is proportionate and avoids needless ceremony]
    EV6: [sources, assumptions, approvals, and outputs are traceable]
  weight: 1.0
  repeats_min: 1
  failure_conditions:
    - invents missing approvals or evidence and treats them as facts
    - removes a control merely to meet the delivery date
  calibration:
    objective: replaced by each packed scenario
    ceiling_anchor: replaced by each packed scenario
    floor_anchor: "A 0–2 response treats lifecycle controls as ceremony, invents missing authority or evidence, or omits an enforceable gate, owner, verification point, or recovery path."
    gaming_rationale: "Fluent process language is insufficient: the response must reconcile the scenario's competing delivery, evidence, authority, and recovery constraints through observable decisions."
    expected_refusal: false
    empirical_status: {design_reviewed: false, empirically_calibrated: false}
scenarios:
  - id: SC-CA01-021
    family: lifecycle-design
    prompt: "Design a gated lifecycle for an AI-generated payroll-rule change that must ship in ten days, uses incomplete policy notes, and affects three countries. Specify artifacts, owners, evidence, rollback, and what cannot advance until clarified."
    calibration: {objective: "design an evidence-gated cross-border change lifecycle", ceiling_anchor: "A 4 ties each gate to a named artifact and owner, isolates country uncertainty, and defines rollback without pretending the policy gaps are resolved."}
  - id: SC-CA01-022
    family: lifecycle-design
    prompt: "A team wants one workflow for AI-assisted prototypes and production services. Define a proportionate lifecycle that keeps experimentation fast while preventing prototype data, dependencies, and approvals from silently becoming production defaults."
    calibration: {objective: "separate experimental and production assurance", ceiling_anchor: "A 4 supplies explicit promotion criteria, evidence carry-forward rules, and a clean boundary that prevents prototype assumptions from becoming production facts."}
  - id: SC-CA01-023
    family: evidence-continuity
    prompt: "Two vendors and an internal agent contribute to a customer-eligibility service. Design the evidence chain from requirement through generated code, tests, release, and incident response when vendor logs have different retention periods."
    calibration: {objective: "preserve end-to-end provenance across suppliers", ceiling_anchor: "A 4 reconciles retention gaps, correlates identities and versions across every stage, and identifies evidence that must be captured before it expires."}
  - id: SC-CA01-024
    family: evidence-continuity
    prompt: "An AI coding assistant changes a shared library used by 40 repositories. Propose the lifecycle controls for impact discovery, owner notification, compatibility proof, staged adoption, and evidence when several repositories have no active maintainer."
    calibration: {objective: "govern a high-fanout shared change", ceiling_anchor: "A 4 establishes dependency evidence, orphan ownership handling, compatibility gates, staged blast-radius limits, and a measurable rollback trigger."}
  - id: SC-CA01-025
    family: autonomy-boundary
    prompt: "Define the permitted actions for an agent that triages defects, edits code, opens pull requests, and can trigger preview deployments, but must never expose customer data or merge production changes. Include enforcement and exception handling."
    calibration: {objective: "translate authority into enforceable lifecycle boundaries", ceiling_anchor: "A 4 maps every action to technical enforcement, identity, logging, and a fail-closed exception path instead of relying on prompt instructions."}
  - id: SC-CA01-026
    family: autonomy-boundary
    prompt: "A release agent may retry failed pipeline jobs. A retry can also repeat a database migration. Define an autonomy policy that distinguishes safe retries from actions requiring a human and proves the distinction at runtime."
    calibration: {objective: "bound retry autonomy by side-effect semantics", ceiling_anchor: "A 4 uses idempotency and migration state evidence, makes unsafe ambiguity fail closed, and records the human decision needed for consequential retries."}
  - id: SC-CA01-027
    family: change-classification
    prompt: "Classify and route a change that only alters a model prompt but changes how medical-support tickets are prioritized. The team calls it documentation-only. Explain the real blast radius, required evidence, and release path."
    calibration: {objective: "classify behavior changes by impact rather than file type", ceiling_anchor: "A 4 rejects the cosmetic label, traces affected decisions and populations, and assigns controls based on behavioral impact with measurable validation."}
  - id: SC-CA01-028
    family: change-classification
    prompt: "An infrastructure template update changes the default region for new AI workloads without modifying application code. Determine the lifecycle classification, affected artifacts, required reviews, and evidence for existing versus new deployments."
    calibration: {objective: "classify a default-changing infrastructure update", ceiling_anchor: "A 4 distinguishes prospective and existing effects, covers residency and dependency implications, and binds approval to verified deployment inventory."}
  - id: SC-CA01-029
    family: exception-governance
    prompt: "A critical accessibility fix is blocked because the normal evaluation environment is unavailable for 48 hours. Design a time-bounded exception that permits safe progress without treating missing evidence as passed evidence."
    calibration: {objective: "design a defensible evidence exception", ceiling_anchor: "A 4 narrows scope, substitutes explicit checks, records accountable acceptance, sets expiry and follow-up, and never converts unavailable evidence into a pass."}
  - id: SC-CA01-030
    family: exception-governance
    prompt: "A vendor security attestation expires during a planned release freeze. Operations requests an automatic 90-day extension. Define the decision process, compensating evidence, monitoring, and conditions that force stop or rollback."
    calibration: {objective: "govern an expiring supplier assurance exception", ceiling_anchor: "A 4 makes extension conditional on current risk evidence, bounded scope and time, named accountability, live monitoring, and hard termination triggers."}
  - id: SC-CA01-031
    family: artifact-integrity
    prompt: "Create the minimum artifact set for a small team using AI to modify a regulated reporting calculation. Avoid duplicate paperwork while retaining requirement, code, test, approval, deployment, and runtime traceability."
    calibration: {objective: "minimize artifacts without breaking traceability", ceiling_anchor: "A 4 creates one coherent evidence graph with reusable records, clear ownership, and no missing link from rule source to observed production behavior."}
  - id: SC-CA01-032
    family: artifact-integrity
    prompt: "A generated test report references a build digest that differs from the release candidate by one dependency lockfile. Decide whether evidence can be reused and define the exact reconciliation or re-execution needed."
    calibration: {objective: "decide evidence reuse under artifact drift", ceiling_anchor: "A 4 identifies what the digest difference can affect, permits only justified partial reuse, and binds any decision to reproducible artifact comparison."}
  - id: SC-CA01-033
    family: feedback-loop
    prompt: "Production users repeatedly override an AI-generated scheduling recommendation. Design a feedback loop that distinguishes model weakness, policy mismatch, UI friction, and legitimate local discretion without training on overrides blindly."
    calibration: {objective: "turn overrides into governed improvement evidence", ceiling_anchor: "A 4 preserves reason and context, tests competing hypotheses, protects sensitive data, and requires validation before feedback changes behavior."}
  - id: SC-CA01-034
    family: feedback-loop
    prompt: "Post-release evaluation improves aggregate quality but degrades a small language group. Define how the lifecycle detects, triages, corrects, validates, and communicates the regression while normal releases continue."
    calibration: {objective: "govern subgroup regression through the lifecycle", ceiling_anchor: "A 4 uses subgroup gates and ownership, contains harm immediately, validates a correction separately, and prevents aggregate metrics from masking recurrence."}
  - id: SC-CA01-035
    family: ownership-handoff
    prompt: "A proof-of-concept built by an innovation team becomes business-critical after its creators leave. Define the evidence and technical conditions required before an operations team accepts ownership."
    calibration: {objective: "make ownership transfer evidence-based", ceiling_anchor: "A 4 inventories unknowns and dependencies, establishes support and rollback readiness, assigns accountable owners, and blocks acceptance where operability cannot be proven."}
  - id: SC-CA01-036
    family: ownership-handoff
    prompt: "A follow-the-sun team hands an active AI-assisted change between regions daily. Design the handoff record so decisions, unresolved risks, environment state, and authority remain unambiguous without copying entire chat histories."
    calibration: {objective: "preserve concise accountable state across handoffs", ceiling_anchor: "A 4 defines a minimal structured state with evidence links, decision owners, expiry, and confirmation by the receiving team."}
  - id: SC-CA01-037
    family: supply-chain-lifecycle
    prompt: "An approved base model is served through a new quantization and runtime combination. Determine which prior evidence remains relevant, what must be requalified, and how downstream teams learn that the deployment identity changed."
    calibration: {objective: "scope requalification for a changed deployment", ceiling_anchor: "A 4 separates model-family evidence from deployment-bound behavior, identifies affected tests and environments, and prevents stale approval inheritance."}
  - id: SC-CA01-038
    family: supply-chain-lifecycle
    prompt: "A transitive package used only by generated code is discovered to have an unclear license and no maintained release. Design the lifecycle response across inventory, build controls, replacement, evidence, and shipped versions."
    calibration: {objective: "manage an AI-introduced supply-chain uncertainty", ceiling_anchor: "A 4 traces actual exposure, blocks new introduction, handles shipped artifacts proportionately, and produces verifiable replacement and closure evidence."}
  - id: SC-CA01-039
    family: measurement-governance
    prompt: "A team reports a 95% AI acceptance rate as proof of engineering productivity. Define a measurement design that separates useful acceleration from rubber-stamping, rework, escaped defects, and work displaced to reviewers."
    calibration: {objective: "design non-gameable lifecycle productivity evidence", ceiling_anchor: "A 4 uses balanced outcome and flow measures, stratifies work and risk, captures delayed costs, and states causal limits rather than treating acceptance as value."}
  - id: SC-CA01-040
    family: measurement-governance
    prompt: "Different teams use incompatible definitions of an AI-assisted change. Propose a minimum classification and event model that supports audit, engineering analysis, and privacy constraints without collecting employee surveillance data."
    calibration: {objective: "standardize lifecycle telemetry proportionately", ceiling_anchor: "A 4 defines stable events and identities, data minimization and access rules, interoperability, and validation that the model answers its intended questions."}
