id: SC-CA01-003
area: CA-01
family: provenance
risk_tier: RT2
prompt: |
  An AI agent produced a change that was merged into a service last
  week. An auditor now asks your team to reconstruct, for that single
  change: who or what produced it, under what authority, and who is
  accountable for it.

  List the provenance your team should have recorded at the time so this
  question can be answered, and explain briefly why review capacity is
  the constraint that makes recording provenance matter in AI-native
  delivery. Do not invent fields your organization is known to capture;
  describe what SHOULD have been recorded.
expected_qualities:
  - names the producing actor, its autonomy level, and the applicable approvals
  - connects the record to traceability (EV6) and audit obligations
  - explains why generation volume makes review the bottleneck
  - does not fabricate specifics about the unseen change or org's actual practice
rubric:
  EV1: [provenance elements are the ones audit actually needs]
  EV2: [covers actor, autonomy level, and approvals, not just one]
  EV6: [links recording to traceability and accountability]
  EV3: [keeps an identifiable accountable human for the change]
  EV4: ["the provenance decision uses canonical identifiers and is structured so another engineer can apply it consistently"]
  EV5: ["the provenance response scales gating and verification effort in proportion to the stated risk"]
weight: 1.0
failure_conditions:
  - asserts specific provenance was captured when the prompt says to describe what SHOULD be  # -> EV1
  - omits the accountable human and treats "the agent did it" as a complete answer            # -> EV3
repeats_min: 3
calibration:
  objective: "reconstruct the accountability record for a single AI-produced change"
  target_competency: CA-01
  ceiling_anchor: |
    Level 3 names the producing actor, its autonomy level, and the approving human
    for the change. Level 4 connects that record to traceability (EV6) and the
    audit obligation, and explains why generation volume makes review the real
    bottleneck - i.e. what record must exist for accountability to be
    reconstructable at all. Naming the actor without the traceable, audit-usable
    record is a 3.
  floor_anchor: |
    Cannot reconstruct the chain, or omits the producing actor or the autonomy
    level it operated under.
  gaming_rationale: |
    It looks like a lookup; the discriminator is knowing which fields make an
    accountable record and why review scales poorly.
  expected_refusal: false
  hold_out_twin: SC-CA01-007
  empirical_status:
    design_reviewed: true
    empirically_calibrated: false
