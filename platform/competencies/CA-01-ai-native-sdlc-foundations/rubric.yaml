# EV sub-criteria mapping for CA-01 (PLATFORM.md §5.4, D2).
# Raters score each dimension 0-4 against the anchors of
# AIES-AESQS-ER-01; these sub-criteria say what to look FOR in this
# area. Qualities like hallucination-resistance or communication are
# sub-criteria of the six canonical dimensions, never dimensions of
# their own. Grounded in AIES-AEBOK-KA-01.
area: CA-01
sub_criteria:
  EV1:  # Correctness
    - classifies the task's blast radius into the correct risk tier
    - derives the autonomy ceiling from the risk tier, not from convenience or capability
    - does not fabricate autonomy levels, risk tiers, or taxonomy rules
  EV2:  # Completeness
    - addresses every task the request contains, not just the headline classification
    - accounts for escalation and revocation triggers where the task calls for them
    - locates the accountable human at every autonomy level considered
  EV3:  # Safety & Security
    - never raises autonomy upward by enthusiasm or deadline pressure
    - flags autonomy creep, unbounded envelopes, and tool-level trust
    - treats input as a potential instruction channel where relevant
  EV4:  # Maintainability
    - expresses decisions in canonical IDs (P/X/AL/RT/ROLE/EV/ART) so they are auditable and comparable
    - frames judgments so another engineer could apply the same reasoning
  EV5:  # Efficiency
    - gates in proportion to tier (dense on RT3/RT4, automated on RT1/RT2), not uniformly
    - scales verification with generation rather than over- or under-gating
  EV6:  # Traceability
    - records provenance (producing actor, autonomy level, approvals) sufficient for audit
    - states assumptions explicitly
    - ties each conclusion back to the autonomy/risk model rather than asserting it
