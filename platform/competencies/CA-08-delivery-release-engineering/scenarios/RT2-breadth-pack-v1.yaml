kind: aies-scenario-pack-v1
defaults:
  area: CA-08
  family: migration-infrastructure
  risk_tier: RT2
  expected_qualities: [defines phased infrastructure and migration states with evidence gates, preserves build provenance configuration identity and rollback limits, handles mixed versions failure and reconciliation, assigns owners monitoring and stop conditions]
  rubric:
    EV1: [release and migration sequence preserves required invariants]
    EV2: [dependencies data compatibility validation rollback and recovery are covered]
    EV3: [access secrets isolation and safe failure remain effective]
    EV4: [automation is reproducible reviewable and maintainable]
    EV5: [rollout uses proportionate capacity and minimizes avoidable disruption]
    EV6: [artifacts approvals environments changes and outcomes are traceable]
  weight: 1.1
  repeats_min: 1
  failure_conditions: [uses rollback as a slogan after irreversible state change, rebuilds different artifacts for later environments]
  calibration:
    objective: replaced by each packed scenario
    ceiling_anchor: replaced by each packed scenario
    expected_refusal: false
    empirical_status: {design_reviewed: false, empirically_calibrated: false}
scenarios:
  - {id: SC-CA08-018, prompt: "Plan delivery of a zero-downtime non-null database column across old and new application versions on a billion-row table. Define expand, backfill, verification, constraint, contract, abort, and forward-repair evidence.", calibration: {objective: "deliver a safe large-table schema migration", ceiling_anchor: "A 4 gates every mixed-version phase with compatibility and reconciliation evidence, bounds backfill load, and states the irreversible boundary."}}
  - {id: SC-CA08-019, prompt: "Plan migration from virtual machines to containers for a stateful service with local disk assumptions, static IP allowlists, scheduled jobs, and 99.95% availability. Include infrastructure parity, traffic shift, data, secrets, and rollback.", calibration: {objective: "deliver a stateful compute-platform migration", ceiling_anchor: "A 4 discovers hidden host contracts, proves storage and identity behavior, migrates jobs once, shifts bounded traffic, and validates rollback before state diverges."}}
  - {id: SC-CA08-020, prompt: "Design a release pipeline for moving from one cloud region to active-active regions while preserving residency, ordered events, DNS failover, and cost limits. Define infrastructure promotion and migration rehearsal.", calibration: {objective: "deliver a governed multi-region transition", ceiling_anchor: "A 4 separates control and data planes, validates residency and ordering under partition, rehearses failover with measurable bounds, and preserves artifact identity."}}
  - {id: SC-CA08-021, prompt: "Plan replacement of a message broker used by 40 producers and consumers. Schemas drift, consumers lag, ordering differs, and dual publishing can duplicate effects. Define compatibility, shadowing, cutover, reconciliation, and retirement.", calibration: {objective: "deliver a heterogeneous broker migration", ceiling_anchor: "A 4 inventories contracts, uses identity-aware dual paths and shadow comparison, proves consumer semantics, reconciles duplicates, and retires only after evidence."}}
  - {id: SC-CA08-022, prompt: "Design delivery for rotating the root certificate authority across services, devices that update monthly, and offline clients. Include trust-bundle overlap, infrastructure rollout, telemetry, compromise response, and final removal.", calibration: {objective: "deliver a long-tail trust-anchor migration", ceiling_anchor: "A 4 sequences trust before identity, measures adoption by real handshake evidence, bounds overlap, supports offline populations, and retains an emergency revocation path."}}
  - {id: SC-CA08-023, prompt: "Plan migration from an external identity provider to a new one while sessions remain active and usernames are not globally unique. Include identity linking, MFA, service accounts, recovery, staged rollout, and audit.", calibration: {objective: "deliver identity-provider migration without account takeover", ceiling_anchor: "A 4 uses verified immutable identity links, separates session and credential transitions, handles nonhuman accounts and recovery, and detects unsafe collisions."}}
  - {id: SC-CA08-024, prompt: "Design infrastructure and release steps for moving secrets from environment variables to a managed secret store across hundreds of deployments. Include bootstrap identity, version overlap, rollback, logging, and leak cleanup.", calibration: {objective: "deliver managed-secret adoption safely", ceiling_anchor: "A 4 solves bootstrap without circular secrets, versions consumers, proves old-secret decay and log hygiene, and distinguishes rollback from compromised-secret restoration."}}
  - {id: SC-CA08-025, prompt: "Plan an operating-system base-image migration after a critical package becomes unsupported. Applications have native dependencies and regulated evidence; capacity cannot double. Define image provenance, compatibility waves, rollback, and exceptions.", calibration: {objective: "deliver a constrained fleet base-image migration", ceiling_anchor: "A 4 uses signed immutable images and representative compatibility evidence, schedules capacity-aware waves, bounds exceptions with expiry, and can identify every remaining old host."}}
  - {id: SC-CA08-026, prompt: "Design delivery for splitting one shared database into tenant shards while the application stays online. Include routing, dual writes, validation, hot tenants, infrastructure automation, cutover, and rollback limits.", calibration: {objective: "deliver online tenant sharding", ceiling_anchor: "A 4 establishes authoritative routing and per-tenant state, validates copy and write convergence, isolates hot tenants, and defines rollback before dual-write divergence."}}
  - {id: SC-CA08-027, prompt: "Plan migration of object storage buckets to a new account with different encryption keys and network policy. Billions of objects include legal holds and active multipart uploads. Define inventory, copy proof, cutover, and retirement.", calibration: {objective: "deliver verifiable protected object migration", ceiling_anchor: "A 4 preserves metadata and holds, handles in-flight writes with a clear authority point, verifies content and encryption, and blocks source deletion until completeness proof."}}
  - {id: SC-CA08-028, prompt: "Design infrastructure-as-code delivery when importing manually created production resources. Some definitions drift, import can recreate resources, and teams share modules. Define discovery, state protection, plan review, rollout, and ownership.", calibration: {objective: "adopt IaC without destructive import", ceiling_anchor: "A 4 inventories and backs up real state, proves import semantics in isolation, blocks replacement, assigns module ownership, and measures drift after adoption."}}
  - {id: SC-CA08-029, prompt: "Plan a Kubernetes version upgrade across clusters running admission controllers, custom resources, and disruption-sensitive workloads. Define compatibility evidence, control-plane and node waves, capacity, rollback, and deprecated API removal.", calibration: {objective: "deliver a safe orchestrator upgrade", ceiling_anchor: "A 4 discovers actual API and controller use, validates disruption budgets and capacity, sequences reversible waves, and distinguishes control-plane rollback limits."}}
  - {id: SC-CA08-030, prompt: "Design delivery for introducing a service mesh gradually. Sidecars alter latency, retry, identity, and observability; some services use long-lived connections. Define opt-in infrastructure, compatibility, measurement, and removal path.", calibration: {objective: "deliver service-mesh infrastructure incrementally", ceiling_anchor: "A 4 tests protocol and resource behavior, prevents retry amplification and identity downgrade, uses bounded cohorts, and keeps an exercised removal path."}}
  - {id: SC-CA08-031, prompt: "Plan migration from cron jobs on one server to a distributed scheduler. Jobs may overlap, have external side effects, and some take longer than their interval. Include identity, locking, catch-up, observability, and cutover.", calibration: {objective: "deliver distributed scheduling without duplicate effects", ceiling_anchor: "A 4 inventories side-effect and concurrency semantics per job, establishes single authority and idempotency, controls catch-up, and proves old scheduling is disabled."}}
  - {id: SC-CA08-032, prompt: "Design a release that changes encryption format for stored records while old application versions remain during rollout. Define key and format versioning, lazy versus bulk migration, compatibility, verification, and incident rollback.", calibration: {objective: "deliver cryptographic data-format evolution", ceiling_anchor: "A 4 supports dual read and controlled write versions, separates key from format rollback, proves coverage and failure recovery, and never logs plaintext."}}
  - {id: SC-CA08-033, prompt: "Plan replacement of a CDN provider for a global site with signed URLs, custom cache rules, bot controls, and customer-managed domains. Include parallel infrastructure, cache correctness, certificate ownership, traffic shift, and rollback.", calibration: {objective: "deliver a global edge-provider migration", ceiling_anchor: "A 4 compares behavior not just reachability, proves signature and cache-key equivalence, handles certificates and DNS timing, and shifts traffic with per-region stop signals."}}
  - {id: SC-CA08-034, prompt: "Design delivery for migrating CI runners from persistent hosts to ephemeral workers. Builds need private dependencies, signing, caches, and regulated logs. Define identity, isolation, provenance, cache safety, capacity, and fallback.", calibration: {objective: "deliver trustworthy ephemeral build infrastructure", ceiling_anchor: "A 4 uses workload identity and isolated signing, binds cache and output provenance to inputs, preserves required evidence, and validates capacity and emergency fallback."}}
  - {id: SC-CA08-035, prompt: "Plan a data-warehouse migration while dashboards, monthly close, and machine-learning jobs continue. Source and target SQL differ; late-arriving facts revise history. Define parallel run, reconciliation, consumer cutover, and decommission.", calibration: {objective: "deliver an analytically correct warehouse migration", ceiling_anchor: "A 4 defines metric-level and row-level reconciliation over late updates, versions consumer contracts, cuts over by workload, and preserves historical reproducibility."}}
  - {id: SC-CA08-036, prompt: "Design infrastructure rollout for private network endpoints replacing public service access. Remote developers, third-party jobs, disaster recovery, and DNS caches complicate cutover. Define access inventory, dual path, verification, and closure.", calibration: {objective: "deliver a private-connectivity migration", ceiling_anchor: "A 4 discovers every caller and resolution path, prevents unintended public fallback, validates DR and third parties, and closes exposure only after flow evidence."}}
  - {id: SC-CA08-037, prompt: "Plan migration of feature flags from an embedded library to a central service. Evaluations must remain deterministic during outages and old releases live for months. Define rule translation, snapshots, shadow comparison, cutover, and retirement.", calibration: {objective: "deliver behavior-preserving flag-platform migration", ceiling_anchor: "A 4 proves rule semantics with historical and generated contexts, versions offline snapshots, measures shadow divergence, and retains compatibility until old clients are evidenced gone."}}
