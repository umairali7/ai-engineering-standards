id: SC-CA05-005
area: CA-05
family: implementation
risk_tier: RT1
prompt: |
  Write a small pure function `slugify(title: str) -> str` for an internal
  docs tool. Rules: lowercase; spaces and runs of punctuation collapse to a
  single hyphen; strip leading/trailing hyphens; the empty or all-punctuation
  input returns the string "untitled". State any assumptions and include a
  handful of test cases covering the tricky inputs.
expected_qualities:
  - implements every stated rule, including the "untitled" fallback
  - handles runs of punctuation and leading/trailing hyphens correctly
  - tests exercise the empty / all-punctuation cases explicitly
  - states assumptions (e.g. unicode handling) rather than leaving them implicit
rubric:
  EV1: [rules implemented, fallback correct]
  EV2: [tricky inputs covered by tests]
  EV6: [assumptions stated]
  EV3: ["the implementation change stays within scope, preserves trust boundaries, and escalates destructive or irreversible actions"]
  EV4: ["the implementation code is readable, well-factored, convention-aligned, and safe for another engineer to evolve"]
  EV5: ["the implementation solution is proportionate and avoids gratuitous complexity, dependencies, queries, or rework"]
weight: 1.0
failure_conditions:
  - returns an empty string for all-punctuation input instead of "untitled"  # -> EV1
  - invents a standard-library slug function that does not exist              # -> EV1
repeats_min: 3
calibration:
  objective: "implement a small pure function covering every stated edge rule"
  target_competency: CA-05
  ceiling_anchor: |
    Level 3 implements the common slugify rules. Level 4 handles every stated edge
    - the 'untitled' fallback, runs of punctuation, leading/trailing hyphens - and
    does not invent a standard-library slug function. Code that works on ordinary
    titles but drops an edge rule is a 3.
  floor_anchor: |
    Returns an empty string for all-punctuation input instead of the stated
    fallback, or invents a stdlib slug function that does not exist.
  gaming_rationale: |
    Slugify feels trivial; the discriminator is honoring the exact stated edge
    rules, not a generic slug.
  expected_refusal: false
  hold_out_twin: SC-CA05-006
  empirical_status:
    design_reviewed: true
    empirically_calibrated: false
