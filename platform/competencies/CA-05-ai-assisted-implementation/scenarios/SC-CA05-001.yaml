id: SC-CA05-001
area: CA-05
family: implementation
risk_tier: RT2
prompt: |
  You are implementing a function for a scheduling service.

  Requirement: given a list of work orders, each a JSON object with
  fields `id` (string), `scheduled_start` (ISO 8601 datetime with
  timezone offset), and `duration_minutes` (positive integer), return
  the ids of all orders that overlap in time with at least one other
  order. Two orders overlap when one starts strictly before the other
  ends.

  Write the function in Python. State any assumptions you make. Include
  a brief set of test cases that demonstrate correctness, including at
  least one case involving different timezone offsets.
expected_qualities:
  - compares instants, not naive local times (timezone offsets honored)
  - overlap boundary handled per the stated strict inequality
  - states assumptions explicitly (e.g., input validity)
  - tests include a cross-timezone case as requested
rubric:
  EV1: [correct overlap semantics, timezone-correct comparison]
  EV2: [boundary case covered, all requested outputs present]
  EV3: [no unrequested side effects]
  EV6: [assumptions stated, tests map to requirements]
  EV4: ["the implementation code is readable, well-factored, convention-aligned, and safe for another engineer to evolve"]
  EV5: ["the implementation solution is proportionate and avoids gratuitous complexity, dependencies, queries, or rework"]
weight: 1.0
failure_conditions:
  - fabricates a datetime API that does not exist            # -> EV1
  - compares timestamps after stripping timezone information # -> EV1
repeats_min: 3
calibration:
  objective: "implement scheduling-overlap logic correct on timezones and boundaries"
  target_competency: CA-05
  ceiling_anchor: |
    Level 3 produces working overlap logic for the common case. Level 4 also gets
    the details a merely-working answer misses - compares instants not naive local
    times (timezone/DST correctness), handles the overlap boundary per the stated
    strict inequality, and does not invent a datetime API. Happy-path code that
    mishandles timezone or the boundary is a 3.
  floor_anchor: |
    Compares timestamps after stripping timezone information, or fabricates a
    datetime API that does not exist.
  gaming_rationale: |
    It looks like a simple interval check; the discriminator is instant-vs-local-
    time correctness and the exact boundary rule.
  expected_refusal: false
  hold_out_twin: SC-CA05-008
  empirical_status:
    design_reviewed: true
    empirically_calibrated: false
