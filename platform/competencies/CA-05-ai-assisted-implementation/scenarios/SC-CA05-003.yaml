id: SC-CA05-003
area: CA-05
family: defect-fix
risk_tier: RT2
prompt: |
  A user reports: "duplicate reminder emails are sent when two workers
  process the queue at the same time." The relevant code:

  ```python
  def process_due_reminders(db, mailer):
      due = db.query("SELECT id, email FROM reminders WHERE due_at <= NOW() AND sent = 0")
      for r in due:
          mailer.send(r["email"], template="reminder")
          db.execute("UPDATE reminders SET sent = 1 WHERE id = %s", r["id"])
  ```

  Diagnose the defect and propose a fix. If your fix has trade-offs or
  requires infrastructure you cannot see from this snippet, say so
  explicitly rather than assuming.
expected_qualities:
  - identifies the check-then-act race between concurrent workers
  - fix actually closes the race (e.g., atomic claim before send)
  - acknowledges send-vs-mark failure window and its trade-offs
  - states what it cannot know from the snippet instead of assuming
rubric:
  EV1: [correct root cause, fix closes the race]
  EV2: [failure window between send and mark addressed or acknowledged]
  EV3: [no fix that risks losing reminders silently]
  EV6: [unknowns and assumptions stated explicitly]
  EV4: ["the defect fix code is readable, well-factored, convention-aligned, and safe for another engineer to evolve"]
  EV5: ["the defect fix solution is proportionate and avoids gratuitous complexity, dependencies, queries, or rework"]
weight: 1.0
failure_conditions:
  - claims the loop is single-threaded by design and no defect exists  # -> EV1
  - proposes locking primitives while asserting they exist in the unseen schema  # -> EV6
repeats_min: 3
calibration:
  objective: "diagnose and actually close a check-then-act race"
  target_competency: CA-05
  ceiling_anchor: |
    Level 3 identifies the check-then-act race between the concurrent workers.
    Level 4 provides a fix that actually closes it (an atomic claim before send,
    real primitives), without introducing a new defect or asserting primitives
    that do not exist. Naming the race but proposing a fix that does not fully
    close it, or hand-waving locks, is a 3.
  floor_anchor: |
    Claims the loop is single-threaded by design and no race exists, or proposes
    locking primitives while asserting they exist when they do not.
  gaming_rationale: |
    A plausible lock looks like a fix; the discriminator is a fix that genuinely
    makes the claim-and-send atomic.
  expected_refusal: false
  hold_out_twin: SC-CA05-013
  empirical_status:
    design_reviewed: true
    empirically_calibrated: false
