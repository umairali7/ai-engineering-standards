kind: aies-scenario-pack-v1
defaults:
  area: CA-05
  risk_tier: RT2
  expected_qualities: [implements a complete verifiable change rather than pseudocode, preserves stated invariants under concurrency and failure, addresses security maintainability and resource bounds, states assumptions and supplies focused tests]
  rubric:
    EV1: [implementation and algorithm satisfy the stated invariants]
    EV2: [edge states, errors, integration, and tests are complete]
    EV3: [input, authorization, privacy, and failure safety are preserved]
    EV4: [change is readable modular and compatible]
    EV5: [resource use is bounded and justified with measurement]
    EV6: [assumptions, changed behavior, and verification are traceable]
  weight: 1.1
  repeats_min: 1
  failure_conditions: [optimizes by changing required semantics, invents unavailable APIs or schema]
  calibration:
    objective: replaced by each packed scenario
    ceiling_anchor: replaced by each packed scenario
    floor_anchor: "A 0–2 response supplies plausible code while violating a stated invariant, losing data or concurrency semantics, weakening authorization, or claiming success without executable verification."
    gaming_rationale: "Syntactically polished code cannot succeed: the implementation must preserve the scenario's exact behavioral invariants and provide evidence that exposes subtle regressions."
    expected_refusal: false
    empirical_status: {design_reviewed: false, empirically_calibrated: false}
scenarios:
  - {id: SC-CA05-019, family: performance-database, prompt: "Implement a Python iterator that exports ten million database rows to CSV without loading them all in memory. It must preserve snapshot consistency, escape safely, cancel promptly, and report a resumable cursor. Include tests and database assumptions.", calibration: {objective: "implement bounded consistent streaming export", ceiling_anchor: "A 4 provides executable streaming code, transaction and cursor semantics, cancellation cleanup, safe CSV handling, and memory and resume tests."}}
  - {id: SC-CA05-020, family: performance-database, prompt: "Replace an N+1 ORM endpoint that returns orders with latest payment status and item totals. Preserve authorization and ordering, handle orders without payments, and show query-count and correctness tests without assuming a specific ORM feature.", calibration: {objective: "remove N+1 work without semantic regression", ceiling_anchor: "A 4 gives a concrete set-based implementation or bounded alternative, preserves tenant predicates and null cases, and proves both query count and result equivalence."}}
  - {id: SC-CA05-021, family: performance-database, prompt: "Implement an idempotent queue consumer that writes an event and updates an aggregate in one relational database. Messages duplicate and reorder; workers race; poison messages must not block the partition. Include schema constraints and tests.", calibration: {objective: "implement concurrency-safe idempotent consumption", ceiling_anchor: "A 4 encodes identity and ordering invariants in transactions and constraints, defines poison handling, and tests races rather than relying on a prior read."}}
  - {id: SC-CA05-022, family: performance-database, prompt: "Optimize a SQL-backed autocomplete endpoint whose leading-wildcard query times out at five million rows. Matching is case- and accent-insensitive, results are tenant-scoped, and updates appear within one minute. Implement a credible change and benchmark plan.", calibration: {objective: "implement indexed autocomplete under semantic constraints", ceiling_anchor: "A 4 selects and implements an index/search strategy matching normalization and freshness, preserves isolation, and benchmarks representative cardinality and update cost."}}
  - {id: SC-CA05-023, family: performance-database, prompt: "Implement safe batch deletion for expired sessions while requests concurrently refresh sessions. The table has 400 million rows and replicas lag. Avoid long locks, deleting refreshed rows, and unbounded transaction logs; provide restart behavior.", calibration: {objective: "implement scalable race-safe retention deletion", ceiling_anchor: "A 4 uses a predicate rechecked at deletion with bounded batches and stable progress, handles replica limitations, and validates concurrency and restart invariants."}}
  - {id: SC-CA05-024, family: performance-database, prompt: "Implement a cache-aside repository for product prices. Prices are versioned, writes can fail after database commit, cache nodes evict independently, and callers require monotonic reads during checkout. State where monotonicity can and cannot be guaranteed.", calibration: {objective: "implement honest cache consistency", ceiling_anchor: "A 4 uses version-aware reads and invalidation with executable failure handling, bounds stale behavior, and refuses to claim monotonicity the architecture cannot provide."}}
  - {id: SC-CA05-025, family: performance-database, prompt: "Refactor a report job that joins large in-memory lists from three queries and exhausts RAM. Preserve duplicate semantics and deterministic output while reducing memory. Supply code, complexity analysis, and regression tests.", calibration: {objective: "reduce report memory without changing multiset semantics", ceiling_anchor: "A 4 implements streaming or database-side work with explicit duplicate and ordering semantics, quantifies complexity, and proves byte-for-byte or defined equivalence."}}
  - {id: SC-CA05-026, family: performance-database, prompt: "Implement optimistic concurrency for editing a customer record through a REST handler and relational store. Concurrent edits must produce a useful conflict, retries must not overwrite unseen changes, and the audit log must identify both versions.", calibration: {objective: "implement lossless optimistic concurrency", ceiling_anchor: "A 4 uses an atomic version predicate, returns an actionable conflict representation, records before and attempted versions, and tests simultaneous writes."}}
  - {id: SC-CA05-027, family: performance-database, prompt: "Implement a partitioned time-series write path that accepts out-of-order readings, rejects duplicates by device sequence, and queries the latest valid reading quickly. Devices may reset their sequence after replacement. Include schema and migration concerns.", calibration: {objective: "implement efficient time-series identity and latest query", ceiling_anchor: "A 4 models device incarnation plus sequence, supports out-of-order storage and indexed latest-valid lookup, and tests replacement and partition boundaries."}}
  - {id: SC-CA05-028, family: performance-database, prompt: "Implement a transactional outbox publisher whose current loop can publish the same row forever after a crash. Multiple publishers run concurrently, delivery is at least once, and rows require retention cleanup. Provide code and failure-injection tests.", calibration: {objective: "implement bounded concurrent outbox publishing", ceiling_anchor: "A 4 atomically claims work, records attempts and completion, accepts and documents duplicate delivery, recovers abandoned claims, and tests crash windows."}}
  - {id: SC-CA05-029, family: performance-optimization, prompt: "Optimize a Node.js endpoint that hashes 5,000 uploaded chunks synchronously and blocks unrelated requests. Preserve digest order, backpressure, cancellation, and error cleanup; provide an implementation and latency/concurrency tests.", calibration: {objective: "remove event-loop blocking with bounded concurrency", ceiling_anchor: "A 4 uses streaming and an appropriate worker strategy, preserves ordered aggregation and backpressure, cancels cleanly, and measures tail latency under mixed load."}}
  - {id: SC-CA05-030, family: performance-optimization, prompt: "Implement a bounded parallel fetcher for 20,000 URLs with per-host limits, global concurrency, retries with jitter, a deadline, response-size caps, and deterministic result ordering. Do not use unbounded task creation.", calibration: {objective: "implement resource-safe high-volume fetching", ceiling_anchor: "A 4 supplies working scheduling code with global and host semaphores, bounded queues, deadline-aware retry, size enforcement, and deterministic collection tests."}}
  - {id: SC-CA05-031, family: performance-optimization, prompt: "Optimize a React table with 100,000 rows, variable heights, keyboard navigation, live updates, and screen-reader semantics. Provide the component strategy and critical code while preserving focus during virtualization.", calibration: {objective: "implement accessible large-list virtualization", ceiling_anchor: "A 4 combines measured virtualization with stable identity, roving focus and semantic row metadata, handles live mutations, and tests accessibility plus frame budget."}}
  - {id: SC-CA05-032, family: performance-optimization, prompt: "Implement a memory-bounded log aggregator that groups by tenant and minute, emits in event-time order, tolerates five minutes of lateness, and cannot let one tenant consume all memory. Define late-event behavior and tests.", calibration: {objective: "implement bounded fair event-time aggregation", ceiling_anchor: "A 4 uses watermarks and per-tenant bounds, defines eviction and late output explicitly, preserves ordering guarantees, and tests skew and adversarial cardinality."}}
  - {id: SC-CA05-033, family: performance-optimization, prompt: "Optimize a Python JSON transformation that processes multi-gigabyte arrays but currently calls json.load. Records can be invalid, output order must match input, and partial output must never look complete. Provide code and measurement.", calibration: {objective: "implement safe streaming JSON transformation", ceiling_anchor: "A 4 uses a real incremental parser and atomic output protocol, localizes invalid records per policy, preserves order, and demonstrates bounded memory."}}
  - {id: SC-CA05-034, family: performance-optimization, prompt: "Implement adaptive batching for an embeddings client with request item and token limits, rate-limit headers, partial failures, and caller cancellation. Results must align with inputs and retries must not duplicate billing unnecessarily.", calibration: {objective: "implement efficient limit-aware embedding batches", ceiling_anchor: "A 4 packs by both limits, preserves identity through partial retry, adapts to explicit capacity signals, cancels outstanding work, and tests alignment and accounting."}}
  - {id: SC-CA05-035, family: performance-optimization, prompt: "Optimize an image pipeline that decodes every source at full resolution before making thumbnails. Implement a safer bounded-memory path for untrusted images, metadata rotation, multiple outputs, and concurrent jobs.", calibration: {objective: "implement secure bounded image processing", ceiling_anchor: "A 4 decodes near target scale where supported, enforces pixel and format limits before allocation, preserves orientation, bounds concurrency, and measures peak memory."}}
  - {id: SC-CA05-036, family: performance-optimization, prompt: "Implement a lock-contention fix for a shared in-process cache where one slow loader blocks all keys. Preserve single-flight behavior per key, error propagation, TTL, cancellation, and eviction under high key cardinality.", calibration: {objective: "implement keyed single-flight without leaks", ceiling_anchor: "A 4 narrows locking to key state, safely shares outcomes, cleans failed and cancelled entries, bounds metadata, and tests races and unrelated-key progress."}}
  - {id: SC-CA05-037, family: performance-optimization, prompt: "Optimize a recursive directory scanner for millions of files. It must respect symlink policy, bounded file descriptors, permission errors, cancellation, deterministic output, and avoid crossing configured roots. Provide implementation and tests.", calibration: {objective: "implement safe scalable filesystem traversal", ceiling_anchor: "A 4 uses bounded iterative traversal, verifies resolved containment, handles cycles and errors explicitly, preserves deterministic output, and measures descriptors and throughput."}}
  - {id: SC-CA05-038, family: performance-optimization, prompt: "Implement incremental recomputation for a dependency graph when source nodes change. Graphs may contain cycles due to bad input, updates arrive in bursts, and consumers need a consistent version. Include algorithm, code, and complexity tests.", calibration: {objective: "implement consistent incremental graph updates", ceiling_anchor: "A 4 validates or isolates cycles, computes the affected closure once per version, coalesces bursts without lost updates, and proves complexity against full recomputation."}}
  - {id: SC-CA05-039, family: refactoring, prompt: "Refactor a 400-line order handler that validates input, authorizes, prices, persists, publishes, and emails. Preserve transaction and error semantics exactly, introduce testable boundaries, and provide characterization plus regression tests.", calibration: {objective: "separate a transactional handler without behavior drift", ceiling_anchor: "A 4 identifies existing observable and transactional boundaries, introduces focused collaborators without speculative abstraction, and proves exact success and failure equivalence."}}
  - {id: SC-CA05-040, family: refactoring, prompt: "Refactor duplicated permission checks across twelve endpoints into one policy component. Some endpoints deliberately mask resource existence while others return forbidden. Preserve those semantics and audit attribution.", calibration: {objective: "centralize authorization without flattening policy semantics", ceiling_anchor: "A 4 models the intentional disclosure modes explicitly, preserves endpoint contracts and audit identity, and uses table and integration tests to prove equivalence."}}
  - {id: SC-CA05-041, family: refactoring, prompt: "Refactor a callback-based Node.js file pipeline to async iteration. Preserve streaming backpressure, first-error behavior, cleanup, cancellation, output order, and the public API used by old callers.", calibration: {objective: "modernize asynchronous control flow safely", ceiling_anchor: "A 4 supplies working adapters and iteration code, preserves backpressure and exact error and cleanup timing, and proves compatibility under cancellation and partial reads."}}
  - {id: SC-CA05-042, family: refactoring, prompt: "Refactor a Python function controlled by nine booleans into explicit request modes. Existing callers pass positional arguments, invalid combinations currently fail differently, and serialized jobs replay old calls.", calibration: {objective: "replace flag combinations without breaking callers", ceiling_anchor: "A 4 derives and encodes valid states, supplies a compatible boundary and migration, preserves documented failures and replay, and prevents new impossible combinations."}}
  - {id: SC-CA05-043, family: refactoring, prompt: "Refactor a SQL report built from nested views into maintainable stages. Preserve duplicate, null, timezone, and row-level-security behavior while enabling each business rule to be tested independently.", calibration: {objective: "decompose complex SQL with semantic equivalence", ceiling_anchor: "A 4 makes each transformation and grain explicit, preserves security and relational edge semantics, and proves result equivalence on adversarial fixtures and plans."}}
  - {id: SC-CA05-044, family: refactoring, prompt: "Refactor a Java service from static global configuration to injected immutable configuration. Tests mutate globals, background threads read values late, and plugins depend on the old accessor.", calibration: {objective: "remove mutable global configuration compatibly", ceiling_anchor: "A 4 identifies initialization and thread visibility semantics, provides a bounded compatibility bridge for plugins, isolates tests, and proves no runtime drift."}}
  - {id: SC-CA05-045, family: refactoring, prompt: "Refactor a React form whose state is duplicated across component state, URL, and a server cache. Preserve back-button behavior, unsaved edits, validation timing, accessibility announcements, and optimistic save rollback.", calibration: {objective: "establish one coherent form-state model", ceiling_anchor: "A 4 assigns authority per state class, preserves navigation and accessibility timing, handles optimistic failure, and proves user-observable equivalence with interaction tests."}}
  - {id: SC-CA05-046, family: refactoring, prompt: "Refactor exception handling in a service where broad catches convert some domain failures to 404, retry others, and mask internal details. Preserve the public error contract while removing accidental swallowing.", calibration: {objective: "make error taxonomy explicit without contract drift", ceiling_anchor: "A 4 reconstructs the existing mapping and retry semantics, introduces typed boundaries and causal logging, preserves safe external responses, and tests every failure class."}}
  - {id: SC-CA05-047, family: refactoring, prompt: "Refactor a synchronous image-processing API to a queued job without changing the existing client contract immediately. Define and implement a compatibility layer, idempotency, status, timeout, and migration path.", calibration: {objective: "introduce asynchronous execution behind a stable boundary", ceiling_anchor: "A 4 distinguishes what can be preserved from what requires contract evolution, implements bounded compatibility and identity, and supplies staged client migration and failure tests."}}
  - {id: SC-CA05-048, family: refactoring, prompt: "Refactor a tenant-aware repository whose callers sometimes forget tenant predicates. Move isolation into the boundary while preserving administrative cross-tenant operations and query performance.", calibration: {objective: "make tenant isolation structural", ceiling_anchor: "A 4 creates separate typed scoped and administrative capabilities, prevents accidental unscoped queries, preserves authorized operations, and proves isolation and plan quality."}}
  - {id: SC-CA05-049, family: refactoring, prompt: "Refactor an inheritance hierarchy for notifications into composition. Email, SMS, and push share retries but differ in validation, rate limits, receipts, and cancellation. Preserve persisted type names used by queued jobs.", calibration: {objective: "replace brittle inheritance with compatible composition", ceiling_anchor: "A 4 separates shared orchestration from channel policy, retains serialized job compatibility and exact receipt behavior, and tests channel-specific failure and retry."}}
  - {id: SC-CA05-050, family: refactoring, prompt: "Refactor a date utility used across billing from naive datetimes to explicit timezone-aware values. Historical records lack zones and month-end behavior is contractually fixed. Provide a staged migration and equivalence tests.", calibration: {objective: "introduce explicit time semantics without rewriting history", ceiling_anchor: "A 4 identifies each time authority, preserves historical interpretation and month boundaries, prevents mixed types, and migrates callers with frozen-clock and DST tests."}}
  - {id: SC-CA05-051, family: refactoring, prompt: "Refactor a polling worker into event-driven processing while preserving eventual fallback when events are lost. Existing poll timing affects SLAs and duplicate processing is tolerated but bounded.", calibration: {objective: "add events without losing reconciliation semantics", ceiling_anchor: "A 4 retains polling as an explicit repair path, defines shared idempotent identity and SLA behavior, prevents double side effects, and verifies loss and delay cases."}}
  - {id: SC-CA05-052, family: refactoring, prompt: "Refactor a public library's string status values into an enum across Python and JSON boundaries. Unknown future values must remain forward-compatible and old pickled objects still load.", calibration: {objective: "strengthen types while preserving wire and storage compatibility", ceiling_anchor: "A 4 uses a tolerant boundary and stable serialized values, handles unknowns explicitly, migrates pickles safely, and proves old and future representation behavior."}}
  - {id: SC-CA05-053, family: refactoring, prompt: "Refactor logging scattered through business code into structured events. Preserve alert queries, privacy redaction, correlation, sampling, and operator-visible message meaning during a dashboard transition.", calibration: {objective: "introduce structured telemetry without observability regression", ceiling_anchor: "A 4 defines versioned event contracts and redaction at the boundary, provides dual-query migration and correlation, and validates dashboards and alerts before retiring old logs."}}
  - {id: SC-CA05-054, family: refactoring, prompt: "Refactor a recursive tree transformation to an iterative implementation to prevent stack overflow. Preserve preorder output, shared-node handling, cycle errors, custom visitor callbacks, and partial-progress semantics.", calibration: {objective: "remove recursion while preserving traversal behavior", ceiling_anchor: "A 4 provides a correct explicit-stack algorithm modeling enter and exit state, defines graph versus tree identity, and proves ordering callbacks cycles and partial failure equivalence."}}
  - {id: SC-CA05-055, family: refactoring, prompt: "Refactor a monolithic feature-flag evaluator into parse, validate, compile, and evaluate stages. Preserve rule precedence, percentage hashing, old snapshots, error fallback, and evaluation latency.", calibration: {objective: "decompose rule evaluation with exact semantic preservation", ceiling_anchor: "A 4 establishes one canonical intermediate form, freezes precedence and hashing with golden cases, supports snapshot versions, and benchmarks the new boundary."}}
  - {id: SC-CA05-056, family: refactoring, prompt: "Refactor a service that passes raw dictionaries between layers into typed domain objects. Inputs contain extra fields, partial update semantics distinguish absent from null, and plugins add namespaced extensions.", calibration: {objective: "add types without losing boundary semantics", ceiling_anchor: "A 4 models absent null and extension data explicitly, validates only at appropriate boundaries, preserves tolerant input and output compatibility, and supplies round-trip tests."}}
  - {id: SC-CA05-057, family: refactoring, prompt: "Refactor duplicated retry loops into a shared utility. Callers differ in idempotency, deadlines, retryable errors, logging, and metrics. Prevent the abstraction from making unsafe operations retryable.", calibration: {objective: "centralize retries without erasing caller policy", ceiling_anchor: "A 4 makes retry policy and operation safety explicit typed inputs, respects end-to-end deadlines and cancellation, preserves telemetry identity, and tests nonretryable side effects."}}
  - {id: SC-CA05-058, family: refactoring, prompt: "Refactor a legacy parser that returns magic sentinel values into explicit results. Hundreds of callers rely on distinctions among missing, malformed, unsupported, and empty; one C extension still calls the old function.", calibration: {objective: "replace sentinels with explicit outcomes compatibly", ceiling_anchor: "A 4 enumerates every old outcome and caller behavior, supplies an exact compatibility adapter for the extension, migrates incrementally, and proves no collapsed state."}}
  - {id: SC-CA05-059, family: refactoring, prompt: "Refactor a mutable shared shopping cart model into immutable updates. Preserve object identity assumptions in UI memoization, optimistic synchronization, undo history, and plugin hooks.", calibration: {objective: "adopt immutable state without interaction regressions", ceiling_anchor: "A 4 defines identity at each boundary, updates memoization and plugins deliberately, preserves sync and undo semantics, and verifies referential plus user-visible behavior."}}
  - {id: SC-CA05-060, family: refactoring, prompt: "Refactor a shell deployment script into a typed application. Preserve exit codes, stdout and stderr consumed by CI, dry-run, signal cleanup, environment precedence, and partial-failure reporting.", calibration: {objective: "replace operational script without interface drift", ceiling_anchor: "A 4 treats command-line and process behavior as a contract, provides equivalent parsing and cleanup, preserves machine-readable output, and uses golden process-level tests."}}
  - {id: SC-CA05-061, family: refactoring, prompt: "Refactor direct third-party SDK calls behind an adapter. Existing code depends on SDK pagination, exceptions, retry headers, and request identifiers; a gradual provider migration is planned.", calibration: {objective: "introduce a provider boundary that preserves useful semantics", ceiling_anchor: "A 4 models stable domain needs while retaining pagination and diagnostic metadata, translates errors without loss, supports side-by-side providers, and uses contract tests."}}
  - {id: SC-CA05-062, family: refactoring, prompt: "Refactor a large regular expression used for validation into readable stages. Preserve Unicode, normalization, length, and error-position behavior and avoid introducing catastrophic backtracking.", calibration: {objective: "replace opaque validation with explicit safe stages", ceiling_anchor: "A 4 reconstructs the accepted language and error contract, handles normalization once, proves equivalence with generated cases, and benchmarks adversarial inputs."}}
  - {id: SC-CA05-063, family: refactoring, prompt: "Refactor a batch job that mutates records while iterating an offset-paginated query. Preserve processing order and restart checkpoints while eliminating skipped records and supporting concurrent inserts.", calibration: {objective: "replace unstable pagination without changing batch semantics", ceiling_anchor: "A 4 uses a stable key or snapshot with durable checkpoints, defines concurrent-insert policy, preserves idempotent ordering, and proves restart and boundary behavior."}}
  - {id: SC-CA05-064, family: refactoring, prompt: "Refactor localization strings embedded in conditionals into message catalogs. Preserve plural rules, placeholders, fallback, security escaping, and snapshot tests across five languages.", calibration: {objective: "externalize localization without content or safety regression", ceiling_anchor: "A 4 uses typed placeholders and locale plural rules, keeps escaping at the correct layer, defines fallback and missing-key behavior, and validates meaning beyond brittle snapshots."}}
  - {id: SC-CA05-065, family: refactoring, prompt: "Refactor a service's startup sequence into explicit dependency initialization. Some dependencies are optional, readiness must not become true too early, shutdown order matters, and tests need deterministic failures.", calibration: {objective: "make lifecycle initialization explicit and testable", ceiling_anchor: "A 4 models required and optional dependency states, gates readiness on real invariants, unwinds partial startup and shutdown in safe order, and injects deterministic failures."}}
