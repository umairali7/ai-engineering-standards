id: SC-CA02-009
area: CA-02
family: elicitation
risk_tier: RT2
prompt: |
  Two stakeholders describe the same feature — a returns process for an
  online store — and they do not agree:

    Operations lead: "Customers should get an instant automatic refund the
    moment they file a return, so support stops getting chase emails."

    Finance lead: "No refund goes out until we physically receive the item
    and inspect it, or we will bleed money to fraud."

  Prepare for an elicitation session that reconciles this. Surface the
  conflict explicitly, produce the questions that would resolve it, and
  identify who else needs to be in the room. Do not pick a winner or write
  the final refund policy yourself — that decision is the stakeholders'.
expected_qualities:
  - names the operations-vs-finance conflict explicitly rather than papering over it
  - produces questions that would resolve it (fraud rate, refund value thresholds, partial/conditional refunds, customer-experience targets)
  - identifies additional stakeholders (fraud/risk, customer support, legal on refund obligations)
  - does not unilaterally decide the refund timing as if it were the analyst's call
rubric:
  EV2: [surfaces the contradiction and the questions/stakeholders needed to resolve it]
  EV3: [distinguishes eliciting the decision from making it; leaves the policy call to the stakeholders]
  EV1: [does not fabricate fraud rates or refund thresholds as established facts]
  EV6: [marks its own suggestions as options to confirm, not decided intent]
  EV4: ["the elicitation output is unambiguous, testable, and structured for downstream engineering use"]
  EV5: ["the elicitation response prioritizes decision-critical gaps without duplicating or flooding requirements"]
weight: 1.0
failure_conditions:
  - picks one stakeholder's position and writes it up as the final refund policy  # -> EV3
  - invents specific fraud-loss or refund-threshold numbers to justify a choice  # -> EV1
repeats_min: 3
calibration:
  objective: "name a stakeholder conflict and resolve it by elicitation, not fiat"
  target_competency: CA-02
  ceiling_anchor: |
    Level 3 names the operations-vs-finance conflict on the returns process
    explicitly. Level 4 produces the questions that would resolve it (fraud rate,
    cost of leniency, policy owner) rather than silently choosing a side -
    surfacing the decision for the right owner. Picking a side unilaterally, or
    missing the conflict, is a 3.
  floor_anchor: |
    Resolves the conflict unilaterally by choosing one stakeholder's version, or
    fails to name it.
  gaming_rationale: |
    Producing 'the requirement' looks decisive; the discriminator is surfacing the
    conflict for resolution rather than choosing.
  expected_refusal: false
  hold_out_twin: SC-CA02-011
  empirical_status:
    design_reviewed: true
    empirically_calibrated: false
