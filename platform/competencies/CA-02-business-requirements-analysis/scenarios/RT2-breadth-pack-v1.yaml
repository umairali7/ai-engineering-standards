kind: aies-scenario-pack-v1
defaults:
  area: CA-02
  risk_tier: RT2
  family: requirements-analysis
  expected_qualities: [elicits and resolves material ambiguity, separates stakeholder statements from validated requirements, defines measurable acceptance and exception behavior, preserves source-to-requirement traceability]
  rubric:
    EV1: [requirements reflect the supplied business facts without invention]
    EV2: [actors, rules, states, exceptions, data, and acceptance are covered]
    EV3: [rights, safety, privacy, and authority constraints are explicit]
    EV4: [requirements are structured, stable, and change-manageable]
    EV5: [analysis focuses effort on consequential unknowns]
    EV6: [every material requirement and assumption has a source or owner]
  weight: 1.0
  repeats_min: 1
  failure_conditions: [silently chooses among conflicting stakeholder claims, writes untestable aspirations as accepted requirements]
  calibration:
    objective: replaced by each packed scenario
    ceiling_anchor: replaced by each packed scenario
    floor_anchor: "A 0–2 response converts assumptions into requirements, misses a material stakeholder or exception, or produces criteria that cannot be traced or objectively verified."
    gaming_rationale: "Restating the prompt cannot succeed: the response must resolve ambiguity into testable, traceable requirements while preserving unresolved decisions and stakeholder constraints."
    expected_refusal: false
    empirical_status: {design_reviewed: false, empirically_calibrated: false}
scenarios:
  - {id: SC-CA02-019, prompt: "Analyze requirements for prorating subscription refunds when finance says calendar days, support says billing cycles, and the contract contains a jurisdiction-specific exception. Produce decisions needed, rule table, examples, and acceptance evidence.", calibration: {objective: "resolve conflicting refund semantics", ceiling_anchor: "A 4 exposes the conflict, anchors each rule to authority and jurisdiction, covers boundary examples, and leaves no invented default."}}
  - {id: SC-CA02-020, prompt: "Define requirements for a family account where minors can join, guardians can delegate limited actions, and consent rules vary by country. Include lifecycle states, revocation, audit, and unresolved legal inputs.", calibration: {objective: "specify delegated family-account authority", ceiling_anchor: "A 4 models age, jurisdiction, delegation, revocation and evidence as explicit states and blocks unsupported legal assumptions."}}
  - {id: SC-CA02-021, prompt: "A warehouse wants AI-generated substitutions when stock is unavailable. Customers, merchandising, allergy policy, and fulfillment disagree on acceptable substitutes. Produce a decision model and testable requirements.", calibration: {objective: "derive safe substitution requirements", ceiling_anchor: "A 4 makes safety exclusions dominant, captures preference and commercial constraints separately, and defines explainable no-substitute behavior."}}
  - {id: SC-CA02-022, prompt: "Specify an invoice-correction workflow spanning customer requests, tax review, ERP posting, and immutable audit records. Corrections may arrive after a closed accounting period. Define states, authorities, evidence, and acceptance tests.", calibration: {objective: "model controlled invoice correction", ceiling_anchor: "A 4 distinguishes economic correction from ledger mutation, defines period-close paths and authorities, and makes every transition testable."}}
  - {id: SC-CA02-023, prompt: "Elicit requirements for offline field inspections that later synchronize. Two inspectors may edit the same asset, timestamps are unreliable, and safety findings must never disappear. Define conflicts, user decisions, and evidence.", calibration: {objective: "specify lossless offline synchronization", ceiling_anchor: "A 4 preserves concurrent safety findings, defines conflict provenance and resolution, and avoids pretending device time establishes truth."}}
  - {id: SC-CA02-024, prompt: "Turn the goal 'reduce customer onboarding to five minutes' into requirements when identity checks can take hours, accessibility support is mandatory, and abandonment analytics must minimize personal data.", calibration: {objective: "translate a speed target into bounded requirements", ceiling_anchor: "A 4 separates active user time from external latency, defines accessible fallbacks and privacy-safe measures, and rejects a misleading single metric."}}
  - {id: SC-CA02-025, prompt: "Define requirements for merging duplicate customer profiles when names differ, one profile has a legal hold, and downstream systems cannot all undo a merge. Include confidence, authority, reversibility, and human review.", calibration: {objective: "specify high-integrity profile deduplication", ceiling_anchor: "A 4 makes irreversible and held records fail closed, defines evidence thresholds and review, and preserves a reconstructable lineage."}}
  - {id: SC-CA02-026, prompt: "Analyze a procurement request for 'the cheapest compliant cloud region.' Residency, latency, carbon, contractual, and availability constraints conflict. Produce a prioritized requirement set without fabricating corporate policy.", calibration: {objective: "structure a multi-objective sourcing requirement", ceiling_anchor: "A 4 distinguishes hard constraints from weighted objectives, names policy owners, defines evidence, and does not collapse trade-offs into cost."}}
  - {id: SC-CA02-027, prompt: "Specify consent requirements for reusing customer support transcripts to improve an AI assistant. Existing notices are vague, deletion requests must propagate, and some records support fraud investigations.", calibration: {objective: "define lawful traceable data reuse requirements", ceiling_anchor: "A 4 separates purposes and legal bases, models deletion and holds, requires dataset lineage, and identifies decisions needing legal authority."}}
  - {id: SC-CA02-028, prompt: "A marketplace needs seller suspension rules combining automated risk signals, human appeals, regulatory deadlines, and emergency containment. Define decisions, timelines, evidence, notification, and reinstatement states.", calibration: {objective: "specify accountable suspension and appeal", ceiling_anchor: "A 4 differentiates containment from final judgment, preserves appeal rights and deadlines, and traces every state to evidence and authority."}}
  - {id: SC-CA02-029, prompt: "Define requirements for transferring a work item between departments with different SLAs and data access. Ownership can be disputed and the customer must not receive contradictory updates.", calibration: {objective: "model cross-department ownership transfer", ceiling_anchor: "A 4 defines atomic ownership, access and SLA transitions, dispute handling, and a single evidence-backed customer communication state."}}
  - {id: SC-CA02-030, prompt: "Analyze requirements for a loyalty-points expiration change. Marketing wants immediate rollout, accounting needs liability accuracy, and customers received inconsistent prior terms. Define cohorts, notice, calculations, exceptions, and migration acceptance.", calibration: {objective: "specify a fair points-policy transition", ceiling_anchor: "A 4 versions terms by cohort, reconciles financial and notice evidence, covers boundary dates, and prevents retroactive unsupported changes."}}
  - {id: SC-CA02-031, prompt: "Specify a bulk data export requested by enterprise administrators. The export spans tenant members, former employees, private drafts, legal holds, and third-party integrations. Define scope, authorization, redaction, and verification.", calibration: {objective: "define authorized tenant export semantics", ceiling_anchor: "A 4 separates admin authority from data ownership, covers former-user and hold states, minimizes disclosure, and makes completeness verifiable."}}
  - {id: SC-CA02-032, prompt: "A hospital wants appointment reminders optimized by predicted no-show risk. Define business requirements that address contact preferences, shared phones, urgent care, language, false positives, and opt-out.", calibration: {objective: "specify safe equitable reminder targeting", ceiling_anchor: "A 4 constrains prediction use, protects sensitive inference, models consent and urgency, and defines subgroup and false-positive acceptance evidence."}}
  - {id: SC-CA02-033, prompt: "Define requirements for approving expense claims from partial receipts and conflicting currency rates. Include fraud escalation, employee appeal, month-end close, and audit reproduction.", calibration: {objective: "model evidence-sensitive expense approval", ceiling_anchor: "A 4 versions exchange-rate authority, distinguishes missing from adverse evidence, defines appeal and close-period paths, and reproduces the decision."}}
  - {id: SC-CA02-034, prompt: "Convert 'support configurable approval chains' into precise requirements for thresholds, substitutions during leave, segregation of duties, delegation expiry, parallel approvals, and rule changes while a request is open.", calibration: {objective: "make configurable approvals unambiguous", ceiling_anchor: "A 4 defines versioned rule evaluation and in-flight semantics, prohibits conflicting roles, and covers delegation expiry and concurrency."}}
  - {id: SC-CA02-035, prompt: "Analyze a requirement to delete inactive accounts after two years when contracts, tax records, user content, backups, and fraud evidence have different retention obligations. Produce a retention decision table and verification plan.", calibration: {objective: "resolve conflicting retention obligations", ceiling_anchor: "A 4 separates record classes and authorities, covers backups and holds, and defines provable deletion without promising impossible erasure."}}
  - {id: SC-CA02-036, prompt: "Specify requirements for changing a customer's primary email when it is also used for authentication, billing notices, and delegated account recovery. Include compromise cases, notification, rollback, and audit.", calibration: {objective: "define secure identifier change", ceiling_anchor: "A 4 separates identity proof from possession, prevents recovery loops, handles compromised channels, and traces notification and rollback."}}
  - {id: SC-CA02-037, prompt: "A public-sector form must work for anonymous applicants yet allow later status tracking and duplicate detection. Define requirements that balance privacy, accessibility, fraud controls, and support recovery.", calibration: {objective: "specify privacy-preserving anonymous case tracking", ceiling_anchor: "A 4 avoids forced identity, defines revocable tracking proof and duplicate handling, and covers accessibility and loss-of-token recovery."}}
  - {id: SC-CA02-038, prompt: "Define requirements for reconciling two systems that disagree on shipment status after a carrier outage. Neither is always authoritative. Include confidence, manual resolution, customer messaging, correction propagation, and audit.", calibration: {objective: "model reconciliation without a false source of truth", ceiling_anchor: "A 4 defines evidence precedence by event and state, preserves uncertainty, coordinates correction, and makes manual overrides accountable."}}
