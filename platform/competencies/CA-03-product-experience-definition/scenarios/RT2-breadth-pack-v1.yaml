kind: aies-scenario-pack-v1
defaults:
  area: CA-03
  risk_tier: RT2
  family: experience-definition
  expected_qualities: [defines complete user and system states, includes accessibility and recovery behavior, resolves business and user tensions with evidence, creates measurable acceptance criteria without invented research]
  rubric:
    EV1: [experience behavior matches the supplied user and product facts]
    EV2: [happy, empty, loading, error, recovery, and edge states are covered]
    EV3: [harmful manipulation, disclosure, and inaccessible dead ends are prevented]
    EV4: [patterns and content remain consistent and maintainable]
    EV5: [interaction cost and product complexity are proportionate]
    EV6: [decisions, assumptions, research gaps, and acceptance are traceable]
  weight: 1.0
  repeats_min: 1
  failure_conditions: [presents an untested preference as user research, covers only the happy path]
  calibration:
    objective: replaced by each packed scenario
    ceiling_anchor: replaced by each packed scenario
    expected_refusal: false
    empirical_status: {design_reviewed: false, empirically_calibrated: false}
scenarios:
  - {id: SC-CA03-019, prompt: "Define the end-to-end experience for recovering an account when the user lost the device, cannot access email, and may be experiencing domestic abuse. Include safe contact, proof, delays, denial, and support states.", calibration: {objective: "design safe high-friction account recovery", ceiling_anchor: "A 4 provides abuse-aware channel choices, transparent staged proof, accessible support and denial recovery without creating an attacker shortcut."}}
  - {id: SC-CA03-020, prompt: "Design a checkout experience when price can change after address validation because of tax and delivery rules. Prevent surprise while preserving a fast path, screen-reader usability, and recovery from payment authorization expiry.", calibration: {objective: "make late price changes comprehensible and recoverable", ceiling_anchor: "A 4 distinguishes estimates from commitments, obtains informed confirmation, preserves cart and payment safety, and specifies accessible state announcements."}}
  - {id: SC-CA03-021, prompt: "Define the product behavior for an AI writing assistant that is uncertain whether a cited source supports a claim. Include inline states, user choices, provenance, offline mode, and acceptance measures.", calibration: {objective: "communicate evidence uncertainty without blocking legitimate work", ceiling_anchor: "A 4 makes unsupported claims unmistakable, preserves source inspection and user agency, degrades honestly offline, and measures correction rather than clicks."}}
  - {id: SC-CA03-022, prompt: "Design bulk approval for 2,000 expense items with mixed risk, partial failures, keyboard-only use, and an audit requirement that each approval remains attributable. Define preview, confirmation, progress, and recovery.", calibration: {objective: "design accountable accessible bulk action", ceiling_anchor: "A 4 supports risk-aware filtering and preview, explicit scope, per-item outcomes, resumability, and durable attribution without 2,000 manual confirmations."}}
  - {id: SC-CA03-023, prompt: "A collaboration app must show edits from people and agents in the same document. Define authorship, conflict, undo, stale-view, and notification experiences without overwhelming users.", calibration: {objective: "make mixed human-agent collaboration legible", ceiling_anchor: "A 4 preserves per-change identity and causality, handles concurrent conflicts and undo limits, and offers layered detail with measurable comprehension."}}
  - {id: SC-CA03-024, prompt: "Design an appointment rescheduling flow for users with fluctuating cognitive capacity, shared caregivers, limited literacy, and appointments that sometimes cannot be changed online. Include consent and escalation states.", calibration: {objective: "design inclusive delegated rescheduling", ceiling_anchor: "A 4 supports lawful delegation and revocation, plain-language confirmation, non-digital escape paths, and protects private details on shared channels."}}
  - {id: SC-CA03-025, prompt: "Define a notification center that combines security alerts, routine updates, marketing, and legally required notices. Users can mute categories, but critical messages require acknowledgment. Avoid dark patterns.", calibration: {objective: "design understandable notification control", ceiling_anchor: "A 4 separates authority and urgency, provides honest preference effects, accessible acknowledgment and expiry, and proves critical delivery without coercive marketing."}}
  - {id: SC-CA03-026, prompt: "Design a dashboard for a prediction whose value can change as late data arrives. Include freshness, uncertainty, explanations, comparison, stale and unavailable states, and prevention of false precision.", calibration: {objective: "present changing uncertain predictions responsibly", ceiling_anchor: "A 4 makes time and uncertainty first-class, distinguishes unavailable from zero, supports decision context, and tests whether users interpret revisions correctly."}}
  - {id: SC-CA03-027, prompt: "Define the experience for merging duplicate contacts when both contain unique notes, permissions differ, sync may fail, and undo is time-limited. Include preview and post-merge recovery.", calibration: {objective: "design a reversible evidence-rich merge", ceiling_anchor: "A 4 previews field and permission consequences, protects unique data, exposes partial sync, and states exact undo boundaries rather than promising full reversal."}}
  - {id: SC-CA03-028, prompt: "A mobile app needs offline task completion with attachments, background sync, and server-side policy changes. Define status, conflict, storage, retry, and user-resolution experiences under poor connectivity.", calibration: {objective: "design truthful offline work and synchronization", ceiling_anchor: "A 4 distinguishes local, queued, rejected and synchronized states, protects attachments, handles policy drift, and gives safe conflict choices."}}
  - {id: SC-CA03-029, prompt: "Design a recommendation feed for a professional tool where relevance competes with diversity, sponsored content, and user control. Define explanations, feedback, reset, empty states, and evaluation against filter bubbles.", calibration: {objective: "balance useful recommendations and user agency", ceiling_anchor: "A 4 labels commercial influence, offers meaningful control and reset, treats feedback as uncertain, and measures diversity and task outcomes rather than engagement alone."}}
  - {id: SC-CA03-030, prompt: "Define onboarding for a complex permissions product. Administrators want rapid setup, but a wrong default can expose data. Include templates, preview, least privilege, import errors, and later review.", calibration: {objective: "design fast but safe permissions onboarding", ceiling_anchor: "A 4 provides constrained templates and effective-access preview, flags risky imports, makes defaults safe, and schedules evidence-based review without blocking all setup."}}
  - {id: SC-CA03-031, prompt: "Design the user experience for a long-running data export that may take hours, partially fail, expire, and contain sensitive files. Include progress, notification, secure retrieval, retry, cancellation, and accessibility.", calibration: {objective: "design secure recoverable asynchronous export", ceiling_anchor: "A 4 defines every asynchronous state and partial outcome, secure expiring retrieval, scoped retry and cancellation semantics, and accessible notifications."}}
  - {id: SC-CA03-032, prompt: "A form uses AI to prefill answers from uploaded documents. Define confidence, review, missing-data, contradiction, correction, and provenance behavior for both expert and low-literacy users.", calibration: {objective: "design accountable AI-assisted form completion", ceiling_anchor: "A 4 ties each value to inspectable evidence, highlights contradictions and uncertainty, supports efficient review, and never makes unconfirmed prefill look user-authored."}}
  - {id: SC-CA03-033, prompt: "Define an appeal experience after an automated eligibility denial. The explanation cannot reveal anti-fraud rules, users may have disabilities, and statutory response times apply.", calibration: {objective: "design meaningful protected appeal", ceiling_anchor: "A 4 gives actionable reasons without exposing controls, offers accessible evidence submission and status, preserves deadlines, and distinguishes review from automatic retry."}}
  - {id: SC-CA03-034, prompt: "Design a settings migration when three legacy privacy toggles become one new control with different semantics. Define mapping, notice, consent, defaults, rollback, and support for users who never open the app.", calibration: {objective: "design a non-deceptive preference migration", ceiling_anchor: "A 4 refuses unjustified equivalence, preserves the most protective unresolved state, communicates effects through reachable channels, and records versioned consent."}}
  - {id: SC-CA03-035, prompt: "Define the experience for scheduling a destructive job across multiple environments. Users need estimates, dependency warnings, approval, dry-run, cancellation, and partial-failure recovery.", calibration: {objective: "design controlled destructive operations", ceiling_anchor: "A 4 makes target and blast radius explicit, uses evidence-backed preview and approval, defines cancellation boundaries, and offers per-environment recovery."}}
  - {id: SC-CA03-036, prompt: "A multilingual support assistant may switch languages mid-conversation and occasionally falls back to English. Define language control, translation disclosure, accessibility, handoff, and quality acceptance.", calibration: {objective: "design reliable multilingual conversational control", ceiling_anchor: "A 4 preserves user language choice and meaning, makes translation and fallback explicit, transfers full context safely, and evaluates quality by language and task."}}
  - {id: SC-CA03-037, prompt: "Design a search experience over documents with different access levels, retention status, and freshness. Results may disappear after permission changes. Include snippets, empty states, saved links, and explanation.", calibration: {objective: "design permission-aware changing search", ceiling_anchor: "A 4 prevents snippet leakage, distinguishes no match from no access, handles stale links honestly, and communicates freshness without revealing protected existence."}}
  - {id: SC-CA03-038, prompt: "Define product behavior when an external identity provider is degraded: some sessions work, new logins fail, administrators can use break-glass access, and status information is incomplete.", calibration: {objective: "design degraded authentication experience", ceiling_anchor: "A 4 communicates differentiated states, protects break-glass secrecy and accountability, avoids false reassurance, and gives safe recovery and support paths."}}
