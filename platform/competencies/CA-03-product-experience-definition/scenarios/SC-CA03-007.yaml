id: SC-CA03-007
area: CA-03
family: experience-definition
risk_tier: RT2
prompt: |
  A team is building a notification-preferences center: one screen where a
  user chooses, per notification category (e.g., security alerts,
  marketing, product updates), whether to receive it by email, push, both,
  or neither.

  Define the end-to-end experience. Cover the non-happy-path states and
  the interaction between categories and channels, and note accessibility
  considerations. Call out any category that should not be fully
  user-disableable and mark it as an assumption to confirm rather than a
  decision you are making. Do not add unrelated features.
expected_qualities:
  - defines the primary flow plus edge states (save success/failure, no push permission granted by the OS, partial save, unsaved-changes navigation)
  - handles the category-by-channel matrix coherently, including the "neither" selection
  - raises that some categories (e.g., security alerts) may need to stay mandatory, framed as an assumption to confirm with product, not decided unilaterally
  - notes accessibility (labeled controls, screen-reader state of each toggle, keyboard traversal, no color-only state)
rubric:
  EV2: [error/permission/partial-save states and the channel matrix covered, not only the happy path]
  EV4: [the experience is concrete and testable rather than described aspirationally]
  EV3: [treats mandatory-category and prioritization decisions as human product calls, flagged not decided]
  EV6: [assumptions about unspecified behavior stated for confirmation]
weight: 1.0
failure_conditions:
  - specifies only successful toggling and ignores the OS-push-permission and save-failure states  # -> EV2
  - unilaterally decides which categories are mandatory and asserts it as settled product intent  # -> EV3
repeats_min: 3
