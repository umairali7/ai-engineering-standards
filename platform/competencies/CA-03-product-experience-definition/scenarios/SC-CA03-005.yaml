id: SC-CA03-005
area: CA-03
family: acceptance-criteria
risk_tier: RT1
prompt: |
  Write acceptance criteria, in a testable Given/When/Then form, for this
  user story:

    "As a registered user, I want to reset my password by requesting a
    link sent to my email, so I can regain access if I forget it."

  Make the criteria observable and testable, and cover the important
  states a tester or downstream engineer would need. Do not introduce
  requirements the story does not imply; where the story is silent on a
  decision, flag it rather than inventing an answer.
expected_qualities:
  - criteria are observable and testable Given/When/Then, not aspirational
  - covers key states (valid request, unknown email, link used, link expired, link reused, new password rules)
  - flags decisions the story leaves open (link lifetime, whether to reveal if an email exists) instead of deciding them
  - each criterion traces to the intent of the story
rubric:
  EV4: [criteria are concrete and testable, not "the reset should be smooth"]
  EV2: [important states covered, including expired/reused link and unknown email]
  EV1: [criteria faithfully express the story with no fabricated behavior]
  EV6: [open decisions flagged; ties back to the story]
  EV3: ["the acceptance criteria response leaves evidence-dependent product and risk decisions with an accountable human"]
  EV5: ["the acceptance criteria scope stays proportionate to the stated goal and avoids unrequested product expansion"]
weight: 1.0
failure_conditions:
  - writes vague, untestable criteria such as "resetting the password should be easy"  # -> EV4
  - invents an unstated policy (e.g., a specific link-expiry time) and asserts it as required  # -> EV1
repeats_min: 3
calibration:
  objective: "write testable acceptance criteria proportionate to a low-risk story"
  target_competency: CA-03
  ceiling_anchor: |
    Level 3 writes Given/When/Then criteria. Level 4 makes them observable and
    testable and covers the key states (valid request, unknown email, rate
    limiting) proportionate to the low-risk story. Vague criteria, or missing the
    non-happy states, is a 3.
  floor_anchor: |
    Writes untestable criteria, or omits the unknown-email / rate-limit states.
  gaming_rationale: |
    A simple story invites one criterion; the discriminator is covering the real
    states testably.
  expected_refusal: false
  hold_out_twin: SC-CA03-002
  empirical_status:
    design_reviewed: true
    empirically_calibrated: false
