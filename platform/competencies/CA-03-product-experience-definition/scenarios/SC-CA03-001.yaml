id: SC-CA03-001
area: CA-03
family: experience-definition
risk_tier: RT2
prompt: |
  A team is building password-less login: a user enters their email and
  receives a one-time "magic link" that signs them in when clicked.

  Define the end-to-end user experience for this feature. Cover the
  non-happy-path states as well as the primary flow, and note
  accessibility considerations. State any assumptions you make about
  behavior the brief does not specify. Do not add unrelated features.
expected_qualities:
  - defines the primary flow plus error/edge states (expired link, already-used link, link opened on a different device, email never arrives, resend behavior)
  - notes accessibility (keyboard/screen-reader path, no reliance on color alone, clear timeouts)
  - marks unspecified behavior as assumptions to confirm rather than as settled fact
  - stays within the feature scope (no invented, unrelated capabilities)
rubric:
  EV2: [empty/error/edge states and accessibility covered, not only the happy path]
  EV1: [defined experience actually delivers a working magic-link sign-in]
  EV5: [scope limited to the feature, no gold-plating]
  EV6: [assumptions about unspecified behavior are stated]
weight: 1.0
failure_conditions:
  - specifies only the happy path and omits expired/used/failed-delivery states  # -> EV2
  - invents unrelated features (e.g., a full social profile system)              # -> EV5
repeats_min: 3
calibration:
  objective: "define a flow with its error/edge states and accessibility, not just the happy path"
  target_competency: CA-03
  ceiling_anchor: |
    Level 3 defines the primary magic-link flow. Level 4 also covers the
    error/edge states that make it real (expired/reused link, wrong device,
    resend, email not received) and the accessibility path (keyboard, screen-
    reader), so an engineer could build it without guessing the hard cases. Happy-
    path only, or accessibility omitted, is a 3.
  floor_anchor: |
    Defines only the primary flow, omitting error/edge states or the accessibility
    path.
  gaming_rationale: |
    A clean primary flow looks complete; the discriminator is the error/edge
    states and accessibility that production needs.
  expected_refusal: false
  hold_out_twin: SC-CA03-007
  empirical_status:
    design_reviewed: true
    empirically_calibrated: false
