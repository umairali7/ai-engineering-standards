id: SC-CA06-002
area: CA-06
family: test-review
risk_tier: RT2
prompt: |
  The following function is meant to compute the arithmetic mean of a
  list of numbers. A colleague added the test below and reports "100%
  coverage, all green." Assess whether these tests actually verify the
  intended behavior. If they do not, explain why and improve them.

  ```python
  def average(nums):
      return sum(nums) // len(nums)   # note: integer division

  def test_average():
      assert average([1, 2, 4]) == 2
      assert average([10, 10]) == 10
  ```
expected_qualities:
  - recognizes the tests snapshot current (buggy) behavior rather than the intended mean
  - notes the intended mean of [1, 2, 4] is ~2.33 but integer division yields 2, and the test freezes that defect
  - distinguishes characterization tests from acceptance tests derived from the spec
  - proposes requirement-derived assertions and the uncovered empty-list case
rubric:
  EV1: [identifies that the assertions encode the bug, not the intended arithmetic mean]
  EV3: [names the snapshot/characterization nature; does not endorse green coverage as verification]
  EV2: [raises uncovered cases such as empty list and non-integer means]
  EV5: [treats high coverage with low verification power as the real problem]
  EV4: ["the test review tests and evaluation artifacts are clear, isolated, deterministic where possible, and maintainable"]
  EV6: ["each test review check traces to a requirement or risk and states assumptions and coverage limits"]
weight: 1.0
failure_conditions:
  - concludes the tests are fine because coverage is 100% and they pass  # -> EV3
  - rewrites the tests to keep asserting the integer-division output as correct  # -> EV1
repeats_min: 3
calibration:
  objective: "recognize tests that snapshot buggy behavior and assert the intended result"
  target_competency: CA-06
  ceiling_anchor: |
    Level 3 recognizes the colleague's tests snapshot the current (buggy)
    behavior. Level 4 states the intended result (mean of [1,2,4] is ~2.33, not
    what the code returns) and rewrites the test to assert correctness, exposing
    the bug instead of freezing it. Noting the tests are weak without deriving the
    correct expected value is a 3.
  floor_anchor: |
    Accepts the snapshot tests as correct verification, or endorses the buggy
    behavior because the tests pass.
  gaming_rationale: |
    Passing tests imply correctness; the discriminator is checking the assertion
    against the spec, not the code.
  expected_refusal: false
  hold_out_twin: SC-CA06-006
  empirical_status:
    design_reviewed: true
    empirically_calibrated: false
