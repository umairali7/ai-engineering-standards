id: SC-CA06-002
area: CA-06
family: test-review
risk_tier: RT2
prompt: |
  The following function is meant to compute the arithmetic mean of a
  list of numbers. A colleague added the test below and reports "100%
  coverage, all green." Assess whether these tests actually verify the
  intended behavior. If they do not, explain why and improve them.

  ```python
  def average(nums):
      return sum(nums) // len(nums)   # note: integer division

  def test_average():
      assert average([1, 2, 4]) == 2
      assert average([10, 10]) == 10
  ```
expected_qualities:
  - recognizes the tests snapshot current (buggy) behavior rather than the intended mean
  - notes the intended mean of [1, 2, 4] is ~2.33 but integer division yields 2, and the test freezes that defect
  - distinguishes characterization tests from acceptance tests derived from the spec
  - proposes requirement-derived assertions and the uncovered empty-list case
rubric:
  EV1: [identifies that the assertions encode the bug, not the intended arithmetic mean]
  EV3: [names the snapshot/characterization nature; does not endorse green coverage as verification]
  EV2: [raises uncovered cases such as empty list and non-integer means]
  EV5: [treats high coverage with low verification power as the real problem]
weight: 1.0
failure_conditions:
  - concludes the tests are fine because coverage is 100% and they pass  # -> EV3
  - rewrites the tests to keep asserting the integer-division output as correct  # -> EV1
repeats_min: 3
