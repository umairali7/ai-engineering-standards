kind: aies-scenario-pack-v1
defaults:
  area: CA-06
  risk_tier: RT2
  expected_qualities: [derives tests from explicit invariants and failure modes, distinguishes oracle evidence from implementation mimicry, covers boundaries concurrency and negative behavior, defines reproducible data environment and exit criteria]
  rubric:
    EV1: [tests can detect the target defect and use valid oracles]
    EV2: [positive negative boundary stateful and recovery cases are covered]
    EV3: [security privacy and harmful failure cases receive explicit tests]
    EV4: [suite is deterministic diagnostic and maintainable]
    EV5: [test cost and selection are proportionate and measured]
    EV6: [requirements cases data versions and results are traceable]
  weight: 1.1
  repeats_min: 1
  failure_conditions: [tests only the happy path, copies implementation logic into the oracle]
  calibration:
    objective: replaced by each packed scenario
    ceiling_anchor: replaced by each packed scenario
    expected_refusal: false
    empirical_status: {design_reviewed: false, empirically_calibrated: false}
scenarios:
  - {id: SC-CA06-018, family: api-validation, prompt: "Design a contract and integration test strategy for a cursor-paginated API while records are inserted and deleted. Verify no duplicate or skipped items under the documented consistency model, invalid cursors, authorization, and client-version compatibility.", calibration: {objective: "validate pagination under mutation", ceiling_anchor: "A 4 derives invariants from declared snapshot semantics, generates adversarial mutations, separates authorization from existence, and tests old clients against versioned contracts."}}
  - {id: SC-CA06-019, family: api-validation, prompt: "Create tests for an idempotent payment API across client timeout, processor timeout, duplicate key, key reuse with different payload, concurrent requests, webhook reordering, and unknown final state. Define the oracle.", calibration: {objective: "validate payment idempotency and uncertainty", ceiling_anchor: "A 4 injects every crash window with a ledger-based oracle, proves at-most-one economic effect, and checks useful stable status for unresolved processor outcomes."}}
  - {id: SC-CA06-020, family: api-validation, prompt: "Design performance and correctness tests for a bulk-upload API handling 20 GB streams, resumable chunks, checksum mismatch, cancellation, quota exhaustion, and partial row errors. Avoid keeping a 20 GB fixture in the repository.", calibration: {objective: "validate scalable resumable upload", ceiling_anchor: "A 4 uses generated sparse or streaming data, verifies memory and backpressure, corrupts selected chunks, and proves resume identity and atomic completion markers."}}
  - {id: SC-CA06-021, family: api-validation, prompt: "Test a webhook system that promises per-account ordering and at-least-once delivery. Cover slow consumers, duplicates, secret rotation, replay windows, dead-letter recovery, and one hot account without making timing-only assertions.", calibration: {objective: "validate ordered webhook delivery robustly", ceiling_anchor: "A 4 uses controlled clocks and event identities, asserts per-key order rather than global order, exercises rotation overlap and recovery, and measures isolation under skew."}}
  - {id: SC-CA06-022, family: api-validation, prompt: "Design tests for a GraphQL gateway with field authorization, query cost limits, partial service failure, schema deprecation, batching, and identity-aware caching. Include a way to catch alias-based cost bypass.", calibration: {objective: "validate a governed federated query boundary", ceiling_anchor: "A 4 generates structurally equivalent bypass queries, proves field policy and cache partitioning, asserts partial-error contracts, and checks schema compatibility."}}
  - {id: SC-CA06-023, family: api-validation, prompt: "Create a test plan for a streaming inference API: first-token latency, ordered chunks, cancellation, budget exhaustion, provider failover, content filtering, and clients disconnecting without reading. Define resource-leak detection.", calibration: {objective: "validate streaming inference lifecycle", ceiling_anchor: "A 4 tests protocol and resource state with controlled slow and disconnected clients, proves cancellation propagation, and distinguishes safe failover before versus after output."}}
  - {id: SC-CA06-024, family: api-validation, prompt: "Design consumer-driven contract tests for an API used by five independently deployed clients. A field changes from required to conditionally absent, errors gain details, and one client ignores unknown fields. Define compatibility gates without freezing evolution.", calibration: {objective: "validate evolvable multi-client contracts", ceiling_anchor: "A 4 versions explicit provider and consumer assumptions, tests semantic absence and error behavior, and gates only demonstrated incompatibility rather than any schema change."}}
  - {id: SC-CA06-025, family: api-validation, prompt: "Test a distributed rate limiter combining tenant, user, endpoint, and burst limits during regional partitions and clock skew. Verify enforcement bounds, explanations, recovery, and that test traffic does not rely on exact wall-clock sleeps.", calibration: {objective: "validate distributed rate enforcement", ceiling_anchor: "A 4 uses virtual time and deterministic capacity models, quantifies permitted partition overshoot, proves multidimensional precedence, and validates explanation against the applied rule."}}
  - {id: SC-CA06-026, family: api-validation, prompt: "Design fuzz and property tests for a signed URL API. Inputs include Unicode paths, duplicate query keys, clock skew, canonicalization differences, key rotation, and proxies that reorder parameters.", calibration: {objective: "validate signature canonicalization and rotation", ceiling_anchor: "A 4 uses an independent canonicalization oracle, metamorphic transformations and rotation overlap, and proves invalid equivalence classes cannot authenticate."}}
  - {id: SC-CA06-027, family: api-validation, prompt: "Create tests for an asynchronous export API with progress, expiry, cancellation, partial failure, and secure download. Include cross-tenant access, stale notification links, repeat requests, and proof that an incomplete file cannot appear complete.", calibration: {objective: "validate secure asynchronous export states", ceiling_anchor: "A 4 models the whole state machine, asserts atomic publication and scoped authorization at retrieval time, and covers expiry and retry races."}}
  - {id: SC-CA06-028, family: database-validation, prompt: "Design migration tests for adding a non-null column to a billion-row table while old and new application versions run. Cover backfill resume, write compatibility, replica lag, constraint validation, rollback boundary, and data reconciliation.", calibration: {objective: "validate expand-contract database migration", ceiling_anchor: "A 4 tests every mixed-version phase with production-shaped scale, failure injection and reconciliation, and states the point after which rollback requires forward repair."}}
  - {id: SC-CA06-029, family: database-validation, prompt: "Create concurrency tests for inventory reservations with expiry, duplicate checkout, late stock updates, and workers racing on the last unit. Define invariants and a deterministic way to force interleavings.", calibration: {objective: "validate reservation invariants under races", ceiling_anchor: "A 4 uses barriers or a scheduler to force critical interleavings, asserts conservation and idempotency from persisted state, and tests expiry versus commit boundaries."}}
  - {id: SC-CA06-030, family: database-validation, prompt: "Test a temporal permissions store with group inheritance, explicit deny, temporary grants, revocation, and historical queries. Include cycles, same-timestamp events, clock differences, and explanation correctness.", calibration: {objective: "validate temporal authorization semantics", ceiling_anchor: "A 4 uses a small independent policy oracle, generates graph and event histories, validates deterministic precedence and historical explanation, and includes cycle defense."}}
  - {id: SC-CA06-031, family: database-validation, prompt: "Design tests for an outbox publisher using at-least-once delivery. Inject crashes before and after commit, publish, acknowledgment, and cleanup; run competing publishers; verify no loss and bounded duplicate behavior.", calibration: {objective: "validate transactional outbox crash safety", ceiling_anchor: "A 4 systematically covers the state-transition matrix with persisted oracles, proves recovery and no loss, and measures duplicates without falsely requiring exactly once."}}
  - {id: SC-CA06-032, family: database-validation, prompt: "Create a test strategy for retention deletion across primary data, search indexes, caches, analytics copies, and backups while legal holds arrive concurrently. Define completion evidence and honest limits for backup erasure.", calibration: {objective: "validate distributed retention and holds", ceiling_anchor: "A 4 traces a synthetic record through every store, races holds with deletion, distinguishes logical expiry from physical backup purge, and produces per-system evidence."}}
  - {id: SC-CA06-033, family: database-validation, prompt: "Test a cache-aside price repository under write failure, stale nodes, eviction, version rollback, and concurrent checkout reads. The requirement is monotonic price-version reads within one checkout, not global strong consistency.", calibration: {objective: "validate scoped monotonic cache behavior", ceiling_anchor: "A 4 encodes checkout-scoped version invariants, injects cache and database failures, forces reordering, and avoids testing a stronger unsupported global property."}}
  - {id: SC-CA06-034, family: database-validation, prompt: "Design property tests for merging duplicate profiles with unique fields, conflicting consent, legal holds, and time-limited undo. Generate merge graphs and prove no source value or provenance silently disappears.", calibration: {objective: "validate lossless governed profile merge", ceiling_anchor: "A 4 generates chained and concurrent merges, uses lineage and consent invariants, tests held-record refusal and exact undo limits, and checks idempotency."}}
  - {id: SC-CA06-035, family: database-validation, prompt: "Create tests for a multi-region counter that allows bounded overshoot during partitions. Validate convergence, duplicate events, region recovery, quota explanation, and the numerical overshoot bound under adversarial timing.", calibration: {objective: "validate bounded distributed quota behavior", ceiling_anchor: "A 4 derives the bound from allocation, explores partition interleavings with a model oracle, proves convergence and duplicate safety, and reports rather than hides permitted overshoot."}}
  - {id: SC-CA06-036, family: database-validation, prompt: "Test recurrence storage for calendar events across daylight-saving gaps, overlaps, timezone database updates, exceptions, and provider sync conflicts. Avoid hard-coding only today's timezone rules.", calibration: {objective: "validate durable recurrence semantics", ceiling_anchor: "A 4 uses versioned timezone fixtures and generative boundary cases, separates local intent from instances, and validates exception identity and sync conflict behavior."}}
  - {id: SC-CA06-037, family: database-validation, prompt: "Design tests for an audit ledger with append-only corrections, redaction markers, schema evolution, legal holds, and time-travel queries. Verify tamper evidence and completeness without treating a hash alone as proof of semantic correctness.", calibration: {objective: "validate verifiable evolving audit history", ceiling_anchor: "A 4 tests chain integrity plus schema interpretation and query completeness, corrupts and omits records deliberately, and verifies correction and redaction semantics."}}
