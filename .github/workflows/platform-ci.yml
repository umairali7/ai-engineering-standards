name: platform-ci

# Continuous integration for the AIES Engineering Assessment Platform,
# docs/PLATFORM.md §10). Runs the conformance test suite — the tests
# keyed to AESQS requirement IDs that keep the engine faithful to the
# standard — on every platform, conformance, or governed-standard change.

on:
  push:
    # conformance/** is the golden corpus (the arbiter, outside platform/): a
    # change to it MUST re-run the conformance gate, or the policy isn't enforced.
    paths:
      - "platform/**"
      - "conformance/**"
      - "Shared/**"
      - "AEBOK/**"
      - "AESQS/**"
      - "AEOS/**"
      - "AEAR/**"
      - "AECT/**"
      - "ECM/**"
      - "adr/**"
      - "docs/**"
      - "templates/**"
      - "*.md"
      - ".github/workflows/*.yml"
  pull_request:
    paths:
      - "platform/**"
      - "conformance/**"
      - "Shared/**"
      - "AEBOK/**"
      - "AESQS/**"
      - "AEOS/**"
      - "AEAR/**"
      - "AECT/**"
      - "ECM/**"
      - "adr/**"
      - "docs/**"
      - "templates/**"
      - "*.md"
      - ".github/workflows/*.yml"

permissions:
  contents: read

jobs:
  workflow-contracts:
    name: GitHub Actions workflow contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned actionlint
        shell: bash
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          curl --fail --silent --show-error --location "${url}" --output "${RUNNER_TEMP}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" actionlint
      - name: Validate every workflow before jobs are scheduled
        run: |
          "${RUNNER_TEMP}/actionlint" -color

  public-release-readiness:
    name: Public release readiness (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Report tracked and external launch gates
        run: |
          python platform/scripts/check_public_release.py .
          python platform/scripts/check_public_release.py . --json > public-release-readiness.json
      - name: Retain readiness evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-release-readiness
          path: public-release-readiness.json
          if-no-files-found: error

  install-and-first-use:
    name: Installed package + first use (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up supported Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python -c "import glob; assert len(glob.glob('dist/*.whl')) == 1; assert len(glob.glob('dist/*.tar.gz')) == 1"
      - name: Validate and hash release distributions
        run: python scripts/build_release_bundle.py --dist dist
      - name: Retain install-tested distributions and hashes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: install-tested-distribution-${{ matrix.os }}
          path: |
            platform/dist/*.whl
            platform/dist/*.tar.gz
            platform/dist/SHA256SUMS
            platform/dist/release-manifest.json
          if-no-files-found: error
      - name: Install the built wheel, not the checkout
        run: python -c "import glob,subprocess,sys; subprocess.check_call([sys.executable,'-m','pip','install','--force-reinstall',glob.glob('dist/*.whl')[0]])"
      - name: Validate shipped data from the installed package
        run: |
          python -m aies suites validate
          python -m aies support ai-deployment --json
          python -m aies assessment-profile validate --json
          python -m aies starter show understand-deployment --json
      - name: Validate installed actionable-failure contract
        run: python -c "import json,subprocess,sys; p=subprocess.run([sys.executable,'-m','aies','support','not-a-subject','--json'],text=True,capture_output=True); d=json.loads(p.stderr); assert p.returncode==2; assert d['kind']=='cli-failure-diagnostic'; assert d['category']=='evidence'; assert d['recovery_command']=='aies support'"
      - name: Clean-install first-run journey (spaces + non-default workspace)
        run: python scripts/clean_install_journey.py --repo ..
      - name: Uninstall cleanly
        run: |
          python -m pip uninstall aies-platform -y
          python -c "import importlib.util; assert importlib.util.find_spec('aies') is None"

  container-reproducibility:
    name: Containerized demo + audit + conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build non-root AIES image
        run: |
          docker build \
            --file platform/Dockerfile \
            --build-arg AIES_REVISION="${GITHUB_SHA}" \
            --tag aies:test .
          test "$(docker image inspect aies:test --format '{{.Config.User}}')" = "10001"
      - name: Run offline demo
        run: |
          docker volume create aies-test-workspace
          trap 'docker volume rm -f aies-test-workspace' EXIT
          docker run --rm \
            --volume aies-test-workspace:/workspace/aies-workspace \
            aies:test demo --workspace /workspace/aies-workspace --parallel 8
      - name: Audit repository read-only
        run: docker run --rm --volume "${GITHUB_WORKSPACE}:/target:ro" aies:test audit /target --rt 2
      - name: Verify decision-engine semantics
        run: docker run --rm aies:test conform engine --corpus /opt/aies/conformance/corpus

  conformance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: platform
    env:
      # Keep the openai-compat runtime probe from touching a real endpoint.
      AIES_OPENAI_BASE_URL: "http://127.0.0.1:9/v1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (editable) + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Conformance tests
        run: pytest tests/ -q
      - name: Suite catalog validation
        run: aies suites validate
      - name: Governed document ID uniqueness
        run: python scripts/check_document_ids.py ..
      - name: Subject-support registry and generated matrix
        run: python scripts/generate_subject_support.py --check
      - name: Subject Assessment Profiles and generated registry
        run: python scripts/generate_assessment_profiles.py --check
      - name: Release hygiene
        run: python scripts/check_release_artifacts.py ..
      - name: Path-based license boundary
        run: python scripts/check_license_boundaries.py ..
      - name: Decision-engine conformance (golden Evidence Package corpus)
        # The arbiter: the reference engine must reproduce every expected outcome
        # in conformance/corpus. Drift from AESQS decision semantics fails here.
        run: aies conform engine --corpus ../conformance/corpus
      - name: Self-audit — repository conformance (dogfood)
        # Audits the repo (one level up from platform/) against AIES engineering
        # practices and gates on RT2's required evidence. If this fails, the repo
        # regressed a required practice — fix it or relax the tier.
        run: aies audit .. --gate --rt 2
      - name: Smoke — offline qualify cycle exits cleanly
        run: |
          aies doctor --json > /dev/null
          aies discover > /dev/null
          aies plugins
      - name: Demo — comprehensive workflow end-to-end, offline (executable docs)
        # The whole platform against the mock runtime: qualify a deployment, the
        # complete automated evaluation, the formal no-grant boundary,
        # decision-engine conformance, the Phase-2 empirical harness, and the
        # repository audit.
        # The core golden path is also gated as tests/test_demo.py above.
        run: bash scripts/demo-full.sh
