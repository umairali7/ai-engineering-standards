name: platform-ci

# Continuous integration for the AIES Engineering Assessment Platform,
# docs/PLATFORM.md §10). Runs the conformance test suite — the tests
# keyed to AESQS requirement IDs that keep the engine faithful to the
# standard — on every platform, conformance, or governed-standard change.

on:
  push:
    # conformance/** is the golden corpus (the arbiter, outside platform/): a
    # change to it MUST re-run the conformance gate, or the policy isn't enforced.
    paths:
      - "platform/**"
      - "conformance/**"
      - "Shared/**"
      - "AEBOK/**"
      - "AESQS/**"
      - "AEOS/**"
      - "AEAR/**"
      - "AECT/**"
      - "ECM/**"
      - "adr/**"
      - "docs/**"
      - "templates/**"
      - "*.md"
      - ".github/workflows/platform-ci.yml"
  pull_request:
    paths:
      - "platform/**"
      - "conformance/**"
      - "Shared/**"
      - "AEBOK/**"
      - "AESQS/**"
      - "AEOS/**"
      - "AEAR/**"
      - "AECT/**"
      - "ECM/**"
      - "adr/**"
      - "docs/**"
      - "templates/**"
      - "*.md"
      - ".github/workflows/platform-ci.yml"

jobs:
  conformance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: platform
    env:
      # Keep the openai-compat runtime probe from touching a real endpoint.
      AIES_OPENAI_BASE_URL: "http://127.0.0.1:9/v1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (editable) + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Conformance tests
        run: pytest tests/ -q
      - name: Suite catalog validation
        run: aies suites validate
      - name: Governed document ID uniqueness
        run: python scripts/check_document_ids.py ..
      - name: Release hygiene
        run: python scripts/check_release_artifacts.py ..
      - name: Decision-engine conformance (golden Evidence Package corpus)
        # The arbiter: the reference engine must reproduce every expected outcome
        # in conformance/corpus. Drift from AESQS decision semantics fails here.
        run: aies conform engine --corpus ../conformance/corpus
      - name: Self-audit — repository conformance (dogfood)
        # Audits the repo (one level up from platform/) against AIES engineering
        # practices and gates on RT2's required evidence. If this fails, the repo
        # regressed a required practice — fix it or relax the tier.
        run: aies audit .. --gate --rt 2
      - name: Smoke — offline qualify cycle exits cleanly
        run: |
          aies doctor --json > /dev/null
          aies discover > /dev/null
          aies plugins
      - name: Demo — comprehensive workflow end-to-end, offline (executable docs)
        # The whole platform against the mock runtime: qualify a deployment, the
        # complete automated evaluation, the formal no-grant boundary,
        # decision-engine conformance, the Phase-2 empirical harness, and the
        # repository audit.
        # The core golden path is also gated as tests/test_demo.py above.
        run: bash scripts/demo-full.sh
