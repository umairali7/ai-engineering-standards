name: security-evidence

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-history:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Bootstrap pinned scanner and scan every reachable commit
        run: >-
          python platform/scripts/run_security_checks.py
          --repo .
          --history-only
          --evidence-dir "${RUNNER_TEMP}"
      - name: Retain redacted secret-scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-redacted-history
          path: |
            ${{ runner.temp }}/gitleaks.json
            ${{ runner.temp }}/gitleaks-metadata.json
          if-no-files-found: error

  python-security:
    name: Python SAST and dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up supported Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/pyproject.toml
      - name: Install pinned security tools
        run: python -m pip install "ruff==0.15.22" "pip-audit==2.10.1"
      - name: Run Python SAST and dependency audit
        run: >-
          python platform/scripts/run_security_checks.py
          --repo .
          --python-only
          --evidence-dir "${RUNNER_TEMP}"
      - name: Retain SAST and dependency evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-security-evidence
          path: |
            ${{ runner.temp }}/ruff-security.sarif
            ${{ runner.temp }}/pip-audit.json
            ${{ runner.temp }}/security-toolchain.json
          if-no-files-found: error
