name: security-evidence

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-history:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          curl --fail --silent --show-error --location "${url}" \
            --output "${RUNNER_TEMP}/${archive}"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${RUNNER_TEMP}/${archive}" \
            | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" version
          printf '%s\n' \
            '{"kind":"aies-security-tool-evidence","schema_version":1,' \
            '"tool":"gitleaks","tool_version":"8.30.1",' \
            '"distribution_sha256":"551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb",' \
            '"scope":"all reachable commits and branches","redaction_percent":100}' \
            | tr -d '\n' > "${RUNNER_TEMP}/gitleaks-metadata.json"
      - name: Scan every reachable commit with redacted output
        run: >-
          "${RUNNER_TEMP}/gitleaks" git
          --log-opts="--all"
          --redact=100
          --no-banner
          --no-color
          --platform=github
          --report-format=json
          --report-path="${RUNNER_TEMP}/gitleaks.json"
          .
      - name: Retain redacted secret-scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitleaks-redacted-history
          path: |
            ${{ runner.temp }}/gitleaks.json
            ${{ runner.temp }}/gitleaks-metadata.json
          if-no-files-found: error

  python-security:
    name: Python SAST and dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up supported Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/pyproject.toml
      - name: Install pinned security tools
        run: |
          python -m pip install "ruff==0.15.22" "pip-audit==2.10.1"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          versions = {
              tool: subprocess.check_output(
                  [tool, "--version"], text=True).strip()
              for tool in ("ruff", "pip-audit")
          }
          document = {
              "kind": "aies-security-toolchain-evidence",
              "schema_version": 1,
              "tools": versions,
              "source_revision": os.environ["GITHUB_SHA"],
              "sast_scope": ["platform/src/aies", "platform/scripts"],
              "dependency_scope": "platform/pyproject.toml resolved environment",
          }
          path = Path(os.environ["RUNNER_TEMP"]) / "security-toolchain.json"
          path.write_text(json.dumps(document, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Run high-signal Python security rules
        run: |
          ruff check platform/src/aies platform/scripts \
            --select S \
            --ignore S101,S110,S112,S603,S607 \
            --output-format sarif \
            --output-file "${RUNNER_TEMP}/ruff-security.sarif"
          ruff check platform/src/aies platform/scripts \
            --select S \
            --ignore S101,S110,S112,S603,S607 \
            --output-format concise
      - name: Audit resolved runtime dependencies
        run: >-
          pip-audit platform
          --format=json
          --output="${RUNNER_TEMP}/pip-audit.json"
          --progress-spinner=off
      - name: Retain SAST and dependency evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-security-evidence
          path: |
            ${{ runner.temp }}/ruff-security.sarif
            ${{ runner.temp }}/pip-audit.json
            ${{ runner.temp }}/security-toolchain.json
          if-no-files-found: error
